<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide Runtime</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    #deck {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .runtime-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    .runtime-canvas {
      --runtime-canvas-width: 1920px;
      --runtime-canvas-height: 1080px;
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--runtime-canvas-width);
      height: var(--runtime-canvas-height);
      overflow: hidden;
      background: #fff;
      transform: translate(-50%, -50%) scale(var(--runtime-canvas-scale, 1));
      transform-origin: center;
    }
    .slide-frame {
      position: absolute;
      inset: 0;
      width: var(--runtime-canvas-width);
      height: var(--runtime-canvas-height);
      border: none;
      background: #fff;
    }
    .runtime-slide[data-active="false"] {
      display: none;
    }
    .runtime-chrome {
      position: absolute;
      z-index: 2;
      padding: 3px 6px;
      color: rgba(20, 25, 35, 0.58);
      font: 500 14px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.04em;
      pointer-events: none;
    }
    .runtime-chrome[data-placement^="top-"] { top: 3.2%; }
    .runtime-chrome[data-placement^="bottom-"] { bottom: 3.2%; }
    .runtime-chrome[data-placement$="-left"] { left: 3.4%; }
    .runtime-chrome[data-placement$="-center"] { left: 50%; transform: translateX(-50%); }
    .runtime-chrome[data-placement$="-right"] { right: 3.4%; }
    .runtime-chrome[data-placement="left-edge"] { left: 1.5%; top: 50%; transform: translateY(-50%); }
    .runtime-chrome[data-placement="right-edge"] { right: 1.5%; top: 50%; transform: translateY(-50%); }
    .runtime-chrome[data-chrome-style~="compact"] { font-size: 16px; }
    .runtime-chrome[data-chrome-style~="tiny"] { font-size: 14px; }
    .runtime-chrome[data-chrome-style~="muted"] { color: rgba(20, 25, 35, 0.58); }
    .runtime-chrome[data-chrome-style~="mono"] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .runtime-chrome[data-chrome-style~="label"] { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="deck"></div>

  <script>
    const deck = document.getElementById('deck');
    const state = {
      slides: [],
      activeIndex: 0
    };

    function isIndex(value) {
      return Number.isInteger(value) && value >= 0;
    }

    function isSlide(value) {
      return value !== null
        && typeof value === 'object'
        && typeof value.id === 'string'
        && value.id.length > 0
        && typeof value.html === 'string'
        && value.frame !== null
        && typeof value.frame === 'object'
        && value.frame.slide_id === value.id
        && value.frame.canvas !== null
        && typeof value.frame.canvas === 'object'
        && value.frame.canvas.width === 1920
        && value.frame.canvas.height === 1080
        && value.frame.canvas.aspect_ratio === '16:9'
        && typeof value.frame.theme_id === 'string'
        && Number.isInteger(value.frame.ordinal)
        && Number.isInteger(value.frame.total);
    }

    function isUpdateDeck(value) {
      return value !== null
        && typeof value === 'object'
        && value.type === 'updateDeck'
        && Array.isArray(value.slides)
        && value.slides.every(isSlide)
        && isIndex(value.index);
    }

    function isGotoSlide(value) {
      return value !== null
        && typeof value === 'object'
        && value.type === 'gotoSlide'
        && isIndex(value.index);
    }

    function setActive(index) {
      const frames = Array.from(deck.querySelectorAll('[data-slide-frame]'));
      if (!frames.length) {
        return;
      }

      const nextIndex = Math.max(0, Math.min(index, frames.length - 1));
      state.activeIndex = nextIndex;

      frames.forEach((frame, frameIndex) => {
        frame.dataset.active = frameIndex === nextIndex ? 'true' : 'false';
        if (frameIndex === nextIndex) fitCanvas(frame, state.slides[frameIndex].frame.canvas);
      });
    }

    function applyRuntimeFrame(container, context) {
      container.querySelectorAll('[data-runtime-chrome]').forEach((node) => node.remove());
      const chrome = Array.isArray(context.chrome) ? context.chrome : [];
      chrome.forEach((item) => {
        if (item.type === 'page_number' && context.numbering?.visible !== true) return;
        const text = item.type === 'page_number' ? String(context.ordinal)
          : item.type === 'section_marker' ? context.section?.title
          : item.type === 'deck_title' ? context.deck_title : '';
        if (!text) return;
        const node = document.createElement('div');
        node.className = 'runtime-chrome';
        node.dataset.runtimeChrome = item.type;
        if (item.type === 'page_number') node.dataset.runtimePageNumber = 'true';
        node.textContent = text;
        node.dataset.placement = item.placement || 'bottom-right';
        node.dataset.chromeStyle = item.style || '';
        if (item.type === 'page_number') node.setAttribute('aria-label', `第 ${context.ordinal} 页，共 ${context.total} 页`);
        container.querySelector('.runtime-canvas').appendChild(node);
      });
    }

    function attachmentContentURL(projectID, source) {
      if (!projectID || typeof source !== 'string') return null;
      const normalized = source.startsWith('/') ? source : `/${source}`;
      const match = normalized.match(/^\/attachments\/(att_[A-Za-z0-9_-]{1,128})\/original\.(png|jpe?g|webp)$/i);
      if (!match) return null;
      return `/api/v1/projects/${encodeURIComponent(projectID)}/attachments/${encodeURIComponent(match[1])}/content?variant=original`;
    }

    function bridgeAttachmentPaths(source, projectID) {
      if (!projectID || typeof source !== 'string') return source;
      return source.replace(/\/?attachments\/(att_[A-Za-z0-9_-]{1,128})\/original\.(png|jpe?g|webp)/gi, (path, attachmentID) => (
        attachmentContentURL(projectID, path) || path
      ));
    }

    function normalizeSlideHTML(source, themeID, projectID) {
		const document = new DOMParser().parseFromString(bridgeAttachmentPaths(source, projectID), 'text/html');
      const head = document.head;
      head.querySelectorAll('link').forEach((link) => {
        const id = link.getAttribute('id');
        const href = link.getAttribute('href') || '';
        if (id === 'base-link' || id === 'theme-link' || href.endsWith('/common/base.css') || href.endsWith('/common/tokens.css')) {
          link.remove();
        }
      });
      const base = document.createElement('link');
      base.id = 'base-link';
      base.rel = 'stylesheet';
      base.href = '/api/v1/runtime/base.css';
      head.appendChild(base);
      const theme = document.createElement('link');
      theme.id = 'theme-link';
      theme.rel = 'stylesheet';
      theme.href = `/api/v1/themes/${encodeURIComponent(themeID)}/css`;
      head.appendChild(theme);
		document.querySelectorAll('img[src], source[src]').forEach((node) => {
			const bridged = attachmentContentURL(projectID, node.getAttribute('src'));
			if (bridged) node.setAttribute('src', bridged);
		});
      return `<!doctype html>${document.documentElement.outerHTML}`;
    }

    function fitCanvas(container, canvas) {
      const availableWidth = container.clientWidth;
      const availableHeight = container.clientHeight;
      if (!availableWidth || !availableHeight) return;
      const wrapper = container.querySelector('.runtime-canvas');
      wrapper.style.setProperty('--runtime-canvas-width', `${canvas.width}px`);
      wrapper.style.setProperty('--runtime-canvas-height', `${canvas.height}px`);
      wrapper.style.setProperty('--runtime-canvas-scale', String(Math.min(availableWidth / canvas.width, availableHeight / canvas.height)));
    }

    function loadSlides(slides) {
      const existing = new Map(
        Array.from(deck.querySelectorAll('[data-slide-frame]')).map((frame) => [frame.dataset.slideId, frame])
      );
      const nextIDs = new Set(slides.map((slide) => slide.id));
      state.slides = slides.slice();

      slides.forEach((slide, index) => {
        let container = existing.get(slide.id);
        if (!container) {
          container = document.createElement('div');
          container.className = 'runtime-slide';
          container.dataset.slideFrame = 'true';
          container.dataset.active = 'false';
          container.dataset.slideId = slide.id;
          const canvas = document.createElement('div');
          canvas.className = 'runtime-canvas';
          const frame = document.createElement('iframe');
          frame.className = 'slide-frame';
          frame.setAttribute('sandbox', 'allow-scripts');
          frame.addEventListener('error', () => {
            window.parent.postMessage({
              type: 'renderError',
              index,
              message: `第 ${index + 1} 页渲染失败`
            }, '*');
          });
          canvas.appendChild(frame);
          container.appendChild(canvas);
        }
        const frame = container.querySelector('iframe');
        const normalizedHTML = normalizeSlideHTML(slide.html, slide.frame.theme_id, slide.frame.project_id);
        if (frame.getAttribute('srcdoc') !== normalizedHTML) {
          frame.srcdoc = normalizedHTML;
        }
        container.dataset.index = String(index);
        frame.title = `Slide ${index + 1}`;
        applyRuntimeFrame(container, slide.frame);
        fitCanvas(container, slide.frame.canvas);
        deck.appendChild(container);
      });

      existing.forEach((container, slideID) => {
        if (!nextIDs.has(slideID)) {
          container.remove();
        }
      });
    }

    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) {
        return;
      }

      try {
        if (isUpdateDeck(event.data)) {
          loadSlides(event.data.slides);
          setActive(event.data.index);
        } else if (isGotoSlide(event.data)) {
          setActive(event.data.index);
        }
      } catch (error) {
        window.parent.postMessage({
          type: 'renderError',
          message: error instanceof Error ? error.message : '未知渲染错误'
        }, '*');
      }
    });

    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => {
        const active = deck.querySelector('[data-slide-frame][data-active="true"]');
        if (active) fitCanvas(active, state.slides[Number(active.dataset.index)].frame.canvas);
      }).observe(deck);
    }

    window.parent.postMessage({ type: 'runtimeReady' }, '*');
  </script>
</body>
</html>
