<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide Runtime</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f0f0f0;
      font-family: sans-serif;
    }
    #content {
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="content">
    <iframe id="slide-frame" src="about:blank"></iframe>
  </div>

  <script>
    const frame = document.getElementById('slide-frame');
    window.addEventListener('message', (event) => {
      const { type, content, index } = event.data;
      if (type === 'update' && content) {
        frame.src = content; // In a real app this might be an HTML path
      } else if (type === 'goto') {
        // Handle goto logic if the iframe supports it natively
      }
    });
  </script>
</body>
</html>
