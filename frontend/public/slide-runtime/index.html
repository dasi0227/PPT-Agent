<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide Runtime</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    #deck {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .slide-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
    .slide-frame[data-active="false"] {
      display: none;
    }
  </style>
</head>
<body>
  <div id="deck"></div>

  <script>
    const deck = document.getElementById('deck');
    const state = {
      slides: [],
      activeIndex: 0
    };

    function sameSlides(nextSlides) {
      if (state.slides.length !== nextSlides.length) {
        return false;
      }

      return state.slides.every((slide, index) => slide === nextSlides[index]);
    }

    function setActive(index) {
      const frames = Array.from(deck.querySelectorAll('[data-slide-frame]'));
      if (!frames.length) {
        return;
      }

      const nextIndex = Math.max(0, Math.min(index, frames.length - 1));
      state.activeIndex = nextIndex;

      frames.forEach((frame, frameIndex) => {
        frame.dataset.active = frameIndex === nextIndex ? 'true' : 'false';
      });
    }

    function loadSlides(slides) {
      if (sameSlides(slides)) {
        return;
      }

      deck.innerHTML = '';
      state.slides = slides.slice();

      slides.forEach((slidePath, index) => {
        const frame = document.createElement('iframe');
        frame.className = 'slide-frame';
        frame.dataset.slideFrame = 'true';
        frame.dataset.active = 'false';
        frame.dataset.index = String(index);
        frame.src = slidePath;
        frame.title = `Slide ${index + 1}`;
        frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
        deck.appendChild(frame);
      });
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) {
        return;
      }

      const { type, slides, index } = event.data || {};

      if (type === 'update' && Array.isArray(slides) && slides.length > 0) {
        loadSlides(slides);
        setActive(typeof index === 'number' ? index : state.activeIndex);
      } else if (type === 'goto' && typeof index === 'number') {
        setActive(index);
      }
    });
  </script>
</body>
</html>
