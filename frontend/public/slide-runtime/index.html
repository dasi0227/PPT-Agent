<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide Runtime</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    #deck {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .slide-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
    .slide-frame[data-active="false"] {
      display: none;
    }
  </style>
</head>
<body>
  <div id="deck"></div>

  <script>
    const deck = document.getElementById('deck');
    const state = {
      slides: [],
      activeIndex: 0
    };

    function isIndex(value) {
      return Number.isInteger(value) && value >= 0;
    }

    function isSlide(value) {
      return value !== null
        && typeof value === 'object'
        && typeof value.id === 'string'
        && value.id.length > 0
        && typeof value.html === 'string';
    }

    function isUpdateDeck(value) {
      return value !== null
        && typeof value === 'object'
        && value.type === 'updateDeck'
        && Array.isArray(value.slides)
        && value.slides.every(isSlide)
        && isIndex(value.index);
    }

    function isGotoSlide(value) {
      return value !== null
        && typeof value === 'object'
        && value.type === 'gotoSlide'
        && isIndex(value.index);
    }

    function sameSlides(nextSlides) {
      if (state.slides.length !== nextSlides.length) {
        return false;
      }

      return state.slides.every((slide, index) => (
        slide.id === nextSlides[index].id && slide.html === nextSlides[index].html
      ));
    }

    function setActive(index) {
      const frames = Array.from(deck.querySelectorAll('[data-slide-frame]'));
      if (!frames.length) {
        return;
      }

      const nextIndex = Math.max(0, Math.min(index, frames.length - 1));
      state.activeIndex = nextIndex;

      frames.forEach((frame, frameIndex) => {
        frame.dataset.active = frameIndex === nextIndex ? 'true' : 'false';
      });
    }

    function loadSlides(slides) {
      if (sameSlides(slides)) {
        return;
      }

      deck.innerHTML = '';
      state.slides = slides.slice();

      slides.forEach((slide, index) => {
        const frame = document.createElement('iframe');
        frame.className = 'slide-frame';
        frame.dataset.slideFrame = 'true';
        frame.dataset.active = 'false';
        frame.dataset.index = String(index);
        frame.srcdoc = slide.html;
        frame.title = `Slide ${index + 1}`;
        frame.setAttribute('sandbox', 'allow-scripts');
        frame.addEventListener('error', () => {
          window.parent.postMessage({
            type: 'renderError',
            index,
            message: `第 ${index + 1} 页渲染失败`
          }, '*');
        });
        deck.appendChild(frame);
      });
    }

    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) {
        return;
      }

      try {
        if (isUpdateDeck(event.data)) {
          loadSlides(event.data.slides);
          setActive(event.data.index);
        } else if (isGotoSlide(event.data)) {
          setActive(event.data.index);
        }
      } catch (error) {
        window.parent.postMessage({
          type: 'renderError',
          message: error instanceof Error ? error.message : '未知渲染错误'
        }, '*');
      }
    });

    window.parent.postMessage({ type: 'runtimeReady' }, '*');
  </script>
</body>
</html>
