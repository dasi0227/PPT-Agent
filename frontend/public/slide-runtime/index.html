<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/api/v1/runtime/fonts.css">
  <script src="/api/v1/runtime/font-loader.js"></script>
  <meta charset="UTF-8">
  <title>Slide Runtime</title>
  <script src="/api/v1/runtime/chrome.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    #deck {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .runtime-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    .runtime-canvas {
      --runtime-canvas-width: 1920px;
      --runtime-canvas-height: 1080px;
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--runtime-canvas-width);
      height: var(--runtime-canvas-height);
      overflow: hidden;
      background: #fff;
      transform: translate(-50%, -50%) scale(var(--runtime-canvas-scale, 1));
      transform-origin: center;
    }
    .slide-frame {
      position: absolute;
      inset: 0;
      width: var(--runtime-canvas-width);
      height: var(--runtime-canvas-height);
      border: none;
      background: #fff;
    }
    .selection-overlay-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
    .selection-draft-box { position: absolute; border: 3px solid #4f46e5; background: rgba(79,70,229,.08); box-sizing: border-box; }
    .selection-draft-box > span { position: absolute; left: -3px; top: -27px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px 7px 7px 0; background: #4f46e5; color: white; font: 700 15px/26px ui-sans-serif,system-ui,sans-serif; text-align: center; }
    .selection-draft-box[data-status="content_deleted"] { border-style: dashed; opacity: .7; }
  </style>
</head>
<body>
  <div id="deck"></div>

  <script>
    const deck = document.getElementById('deck');
    const state = {
      slides: [],
      activeIndex: 0,
      visible: true,
      activeExecution: null,
      executions: new Map(),
      selection: { mode: 'none', sessionID: '', slideID: '', hash: '' },
      drafts: new Map()
    };

    function isIndex(value) {
      return Number.isInteger(value) && value >= 0;
    }

    function isSlide(value) {
      return value !== null
        && typeof value === 'object'
        && typeof value.id === 'string'
        && value.id.length > 0
        && typeof value.html === 'string'
        && value.frame !== null
        && typeof value.frame === 'object'
        && value.frame.slide_id === value.id
        && value.frame.canvas !== null
        && typeof value.frame.canvas === 'object'
        && value.frame.canvas.width === 1920
        && value.frame.canvas.height === 1080
        && value.frame.canvas.aspect_ratio === '16:9'
        && (value.frame.appearance === null || (value.frame.appearance && typeof value.frame.appearance.hash === 'string' && typeof value.frame.appearance.theme_css_url === 'string' && value.frame.appearance.chrome_tokens))
        && typeof value.frame.theme_id === 'string'
        && Number.isInteger(value.frame.ordinal)
        && Number.isInteger(value.frame.total);
    }

    function isUpdateDeck(value) {
      return value !== null
        && typeof value === 'object'
        && value.type === 'updateDeck'
        && Array.isArray(value.slides)
        && value.slides.every(isSlide)
        && isIndex(value.index);
    }

    function isGotoSlide(value) {
      return value !== null
        && typeof value === 'object'
        && value.type === 'gotoSlide'
        && isIndex(value.index);
    }

    function isReplayCurrentSlide(value) {
      return value !== null
        && typeof value === 'object'
        && value.type === 'replayCurrentSlide'
        && Object.keys(value).length === 2
        && typeof value.slide_id === 'string'
        && value.slide_id.length > 0;
    }

    function validRect(value) {
      return value && [value.x, value.y, value.width, value.height].every((item) => typeof item === 'number' && Number.isFinite(item))
        && value.x >= 0 && value.y >= 0 && value.width >= 0 && value.height >= 0
        && value.x + value.width <= 1920.001 && value.y + value.height <= 1080.001;
    }

    function isSelectionMode(value) {
      return value && value.type === 'setSelectionMode' && typeof value.session_id === 'string'
        && typeof value.slide_id === 'string' && ['none', 'element', 'region'].includes(value.mode)
        && typeof value.html_hash === 'string';
    }

    function isDraftRender(value) {
      return value && value.type === 'renderDraftSelections' && typeof value.session_id === 'string'
        && typeof value.slide_id === 'string' && Array.isArray(value.selections)
        && value.selections.every((item) => item && typeof item.selection_id === 'string' && Number.isInteger(item.marker_no) && item.marker_no > 0 && validRect(item.rect));
    }

    function isSelectionProbe(value) {
      return value && value.type === 'probeDraftSelections' && typeof value.session_id === 'string'
        && typeof value.slide_id === 'string' && Array.isArray(value.selections) && value.selections.length <= 8;
    }

    function validIncomingSelection(value) {
      if (!value || !['element', 'region'].includes(value.kind) || value.slide_id !== state.selection.slideID
        || value.html_hash !== state.selection.hash
        || value.canvas?.width !== 1920 || value.canvas?.height !== 1080 || value.status !== 'active'
        || !validRect(value.rect) || value.rect.width <= 0 || value.rect.height <= 0 || !Array.isArray(value.dom_targets) || value.dom_targets.length > 50
        || !Array.isArray(value.chrome_targets)) return false;
      if (new TextEncoder().encode(JSON.stringify({ dom_targets: value.dom_targets, chrome_targets: value.chrome_targets })).byteLength > 128 * 1024) return false;
      const targetsValid = value.dom_targets.every((target) => target && typeof target.target_id === 'string' && target.target_id.length > 0
        && typeof target.tag === 'string' && target.tag.length > 0 && validRect(target.rect) && target.rect.width > 0 && target.rect.height > 0
        && target.fingerprint && typeof target.fingerprint === 'object' && target.fingerprint.tag === target.tag
        && Array.isArray(target.candidate_selectors) && target.candidate_selectors.length <= 3
        && target.box_model && validRect(target.box_model.content)
        && target.computed_style && typeof target.computed_style === 'object');
      const chromeTypes = ['page_number', 'section_marker', 'key_message', 'deck_title'];
      const chromeValid = value.chrome_targets.every((target) => target && chromeTypes.includes(target.type)
        && typeof target.placement === 'string' && typeof target.style === 'string' && typeof target.text === 'string'
        && validRect(target.rect) && target.rect.width > 0 && target.rect.height > 0);
      return targetsValid && chromeValid && value.dom_targets.length + value.chrome_targets.length > 0;
    }

    function applyRuntimeFrame(container, context) {
      window.PPTChrome.render(container.querySelector('.runtime-canvas'), context).forEach(node => {
        node.addEventListener('click', (event) => {
          if (state.selection.mode !== 'element' || state.selection.slideID !== context.slide_id) return;
          event.preventDefault();
          event.stopPropagation();
          const rect = rectForNode(node);
          const chrome = chromeTargets(container, rect).filter((target) => target.type === node.dataset.runtimeChrome);
          finishSelection({
            selection_id: '', marker_no: 0, kind: 'element', comment: '', slide_id: context.slide_id,
            html_hash: state.selection.hash,
            canvas: { width: 1920, height: 1080 }, rect, status: 'active', dom_targets: [], chrome_targets: chrome,
            dedupe_key: 'chrome|' + context.slide_id + '|' + state.selection.hash + '|' + node.dataset.runtimeChrome + '|' + node.dataset.placement
          });
        });
      });
    }

    function attachmentContentURL(projectID, source) {
      if (!projectID || typeof source !== 'string') return null;
      const normalized = source.startsWith('/') ? source : `/${source}`;
      const match = normalized.match(/^\/attachments\/(att_[A-Za-z0-9_-]{1,128})\/original\.(png|jpe?g|webp)$/i);
      if (!match) return null;
      return `/api/v1/projects/${encodeURIComponent(projectID)}/attachments/${encodeURIComponent(match[1])}/content?variant=original`;
    }

    function bridgeAttachmentPaths(source, projectID) {
      if (!projectID || typeof source !== 'string') return source;
      return source.replace(/\/?attachments\/(att_[A-Za-z0-9_-]{1,128})\/original\.(png|jpe?g|webp)/gi, (path, attachmentID) => (
        attachmentContentURL(projectID, path) || path
      ));
    }

    function normalizeSlideHTML(source, appearance, projectID, slideID, visible) {
		const document = new DOMParser().parseFromString(bridgeAttachmentPaths(source, projectID), 'text/html');
      const head = document.head;
      document.documentElement.dataset.previewActive = String(visible);
      const suspension = document.createElement('style');
      suspension.textContent = 'html[data-preview-active="false"] *,html[data-preview-active="false"] *::before,html[data-preview-active="false"] *::after{animation-play-state:paused!important}';
      head.appendChild(suspension);
      head.querySelectorAll('link').forEach((link) => {
        const id = link.getAttribute('id');
        const href = link.getAttribute('href') || '';
        if (id === 'fonts-link' || id === 'base-link' || id === 'theme-link' || href.endsWith('/common/base.css') || href.endsWith('/common/tokens.css')) {
          link.remove();
        }
      });
      const links = [
        ['fonts-link','/api/v1/runtime/fonts.css'], ['base-link','/api/v1/runtime/base.css'],
        ['theme-link',appearance?.theme_css_url || '']
      ].map(([id,href])=>{const link=document.createElement('link');link.id=id;link.rel='stylesheet';if(href)link.href=href;return link;});
      head.prepend(...links);
      const fontLoader=document.createElement('script');fontLoader.src='/api/v1/runtime/font-loader.js';head.appendChild(fontLoader);
      const themeBridge=document.createElement('script');themeBridge.src='/api/v1/runtime/theme-bridge.js';themeBridge.dataset.slideId=slideID;
      document.body.appendChild(themeBridge);
		document.querySelectorAll('img[src], source[src]').forEach((node) => {
			const bridged = attachmentContentURL(projectID, node.getAttribute('src'));
			if (bridged) node.setAttribute('src', bridged);
		});
      const bridge = document.createElement('script');
      bridge.src = '/slide-runtime/selection-bridge.js';
      bridge.dataset.slideId = slideID;
      document.body.appendChild(bridge);
      return `<!doctype html>${document.documentElement.outerHTML}`;
    }

    function fitCanvas(container, canvas) {
      const availableWidth = container.clientWidth;
      const availableHeight = container.clientHeight;
      if (!availableWidth || !availableHeight) return;
      const wrapper = container.querySelector('.runtime-canvas');
      wrapper.style.setProperty('--runtime-canvas-width', `${canvas.width}px`);
      wrapper.style.setProperty('--runtime-canvas-height', `${canvas.height}px`);
      wrapper.style.setProperty('--runtime-canvas-scale', String(Math.min(availableWidth / canvas.width, availableHeight / canvas.height)));
    }

    const MAX_EXECUTIONS = 5;
    let preloadTimer;

    function matches(execution, slide) {
      return execution && execution.container.isConnected && execution.html === slide.html
        && execution.projectID === slide.frame.project_id;
    }

    function evictExecutions() {
      for (const [id, execution] of state.executions) {
        if (state.executions.size <= MAX_EXECUTIONS) break;
        if (execution === state.activeExecution) continue;
        execution.container.remove();
        state.executions.delete(id);
      }
    }

    function prepareNeighbors() {
      clearTimeout(preloadTimer);
      if (!state.activeExecution?.appliedHash) return;
      preloadTimer = setTimeout(() => {
        for (const index of [state.activeIndex + 1, state.activeIndex - 1]) {
          const slide = state.slides[index];
          if (!slide) continue;
          let execution = state.executions.get(slide.id);
          if (!matches(execution, slide)) {
            execution?.container.remove();
            state.executions.delete(slide.id);
            execution = createExecution(slide, index);
          }
          if (execution.ready && execution.requestedHash !== (slide.frame.appearance?.hash || 'unavailable')) {
            requestAppearance(slide, false, execution);
          }
        }
        evictExecutions();
      }, 150);
    }

    function renderSlide(index, forceReplay = false) {
      if (!isIndex(index) || index >= state.slides.length) return false;
      clearTimeout(preloadTimer);
      const slide = state.slides[index];
      let execution = state.executions.get(slide.id);
      if (forceReplay || !matches(execution, slide)) {
        execution?.container.remove();
        state.executions.delete(slide.id);
        execution = createExecution(slide, index, state.visible);
      }
      // Keep the iframe connected. Moving or detaching it would restart the document.
      state.activeIndex = index;
      state.activeExecution = execution;
      state.executions.delete(slide.id);
      state.executions.set(slide.id, execution);
      for (const cached of state.executions.values()) {
        const active = cached === execution;
        cached.container.dataset.active = String(active);
        cached.container.style.visibility = active ? '' : 'hidden';
        cached.container.style.pointerEvents = active ? '' : 'none';
        cached.container.toggleAttribute('inert', !active);
        cached.container.setAttribute('aria-hidden', String(!active));
        sendVisibility(cached);
      }
      execution.container.dataset.index = String(index);
      execution.container.querySelector('iframe').title = `Slide ${index + 1}`;
      const hash = slide.frame.appearance?.hash || 'unavailable';
      if (execution.appliedHash === hash) {
        applyRuntimeFrame(execution.container, slide.frame);
        window.parent.postMessage({type:'themeApplied',slide_id:slide.id,appearance_hash:hash}, '*');
        prepareNeighbors();
      } else {
        window.parent.postMessage({type:'themeApplying',slide_id:slide.id,appearance_hash:slide.frame.appearance?.hash || ''}, '*');
        if (execution.requestedHash !== hash || execution.error) requestAppearance(slide, false, execution);
      }
      fitCanvas(execution.container, slide.frame.canvas);
      renderDrafts(slide.id);
      postModeToInner();
      evictExecutions();
      return true;
    }

    function createExecution(slide, index, visible = false) {
      const normalizedHTML = normalizeSlideHTML(slide.html, slide.frame.appearance, slide.frame.project_id, slide.id, visible);
      const container = document.createElement('div');
      container.className = 'runtime-slide';
      container.dataset.slideFrame = 'true';
      container.dataset.active = 'false';
      container.style.visibility = 'hidden';
      container.style.pointerEvents = 'none';
      container.setAttribute('inert', '');
      container.dataset.slideId = slide.id;
      container.dataset.index = String(index);

      const canvas = document.createElement('div');
      canvas.className = 'runtime-canvas';
      const frame = document.createElement('iframe');
      frame.className = 'slide-frame';
      frame.setAttribute('sandbox', 'allow-scripts');
      frame.title = `Slide ${index + 1}`;
      frame.addEventListener('error', () => {
        if (state.activeExecution?.container !== container) return;
        const currentIndex = Number(container.dataset.index);
        window.parent.postMessage({
          type: 'renderError',
          index: currentIndex,
          message: `第 ${currentIndex + 1} 页渲染失败`
        }, '*');
      });
      frame.addEventListener('load', () => {
        if (state.activeExecution?.container !== container) return;
        postModeToInner();
        renderDrafts(slide.id);
      });
      frame.srcdoc = normalizedHTML;
      canvas.appendChild(frame);

      const overlays = document.createElement('div');
      overlays.className = 'selection-overlays';
      overlays.style.cssText = 'position:absolute;inset:0;z-index:3;pointer-events:none';
      canvas.appendChild(overlays);
      container.appendChild(canvas);


      const execution = {
        slideID: slide.id, projectID: slide.frame.project_id,
        html: slide.html,
        appliedHash: null, requestedHash: null, requestID:0, ready:false,
        container
      };
      state.executions.set(slide.id, execution);
      deck.appendChild(container);
      fitCanvas(container, slide.frame.canvas);
      renderDrafts(slide.id);
      return execution;
    }

    function sendVisibility(execution) {
      execution.container.querySelector('iframe').contentWindow.postMessage({
        bridge: 'ppt-theme-v1', type: 'setPreviewVisibility', slide_id: execution.slideID,
        active: state.visible && execution === state.activeExecution,
      }, '*');
    }

    let appearanceSequence=0;
    async function requestAppearance(slide, force=false, execution=state.activeExecution) {
      if(!execution || execution.slideID!==slide.id || !execution.ready) return;
      const hash=slide.frame.appearance?.hash || 'unavailable';
      if(!force && execution.requestedHash===hash && !execution.error)return;
      execution.error = null;
      const request=++appearanceSequence;execution.requestID=request;execution.requestedHash=hash;
      execution.container.querySelector('iframe').contentWindow.postMessage({bridge:'ppt-theme-v1',type:'cancelTheme',slide_id:slide.id,request_id:request},'*');
      if (execution === state.activeExecution) window.parent.postMessage({type:'themeApplying',slide_id:slide.id,appearance_hash:slide.frame.appearance?.hash || ''},'*');
      try {
        if(!slide.frame.appearance)throw new Error('当前主题不可用，请从主题仓库选择现有主题');
        await window.PPTFonts.prepare();
        if(state.executions.get(slide.id)!==execution || request!==execution.requestID)return;
        execution.container.querySelector('iframe').contentWindow.postMessage({bridge:'ppt-theme-v1',type:'applyTheme',slide_id:slide.id,request_id:request,appearance:slide.frame.appearance,theme_id:slide.frame.theme_id},'*');
      }catch(error){
        if(state.executions.get(slide.id)===execution && request===execution.requestID) {
          execution.error = error.message;
          if (execution === state.activeExecution) window.parent.postMessage({type:'themeApplyFailed',slide_id:slide.id,appearance_hash:slide.frame.appearance?.hash || '',message:error.message},'*');
        }
      }
    }

    function updateDeck(slides, index) {
      clearTimeout(preloadTimer);
      for (const [id, execution] of state.executions) {
        const slide = slides.find(slide => slide.id === id);
        if (!slide || !matches(execution, slide)) {
          execution.container.remove();
          state.executions.delete(id);
        }
      }
      if (slides.length === 0) {
        state.slides = [];
        state.activeIndex = 0;
        state.activeExecution = null;
        deck.replaceChildren();
        return;
      }
      if (index >= slides.length) return;
      state.slides = slides.slice();
      renderSlide(index);
    }

    function containerFor(slideID) {
      return Array.from(deck.querySelectorAll('[data-slide-frame]')).find((item) => item.dataset.slideId === slideID) || null;
    }

    function postModeToInner() {
      const config = state.selection;
      const container = containerFor(config.slideID);
      const frame = container && container.querySelector('iframe');
      if (frame) frame.contentWindow.postMessage({
        bridge: 'ppt-dom-selection-v1', type: 'innerSetSelectionMode', slide_id: config.slideID,
        session_id: config.sessionID, mode: config.mode, html_hash: config.hash
      }, '*');
      deck.querySelectorAll('[data-runtime-chrome]').forEach((node) => {
        const enabled = config.mode === 'element' && node.closest('[data-slide-frame]') === container;
        node.style.pointerEvents = enabled ? 'auto' : 'none';
        node.style.cursor = enabled ? 'crosshair' : '';
        node.style.zIndex = enabled ? '4' : '';
      });
    }

    function renderDrafts(slideID) {
      const container = containerFor(slideID);
      const layer = container && container.querySelector('.selection-overlays');
      if (!layer) return;
      layer.replaceChildren();
      (state.drafts.get(slideID) || []).forEach((item) => {
        if (item.status === 'page_deleted') return;
        const box = document.createElement('div');
        box.className = 'selection-box';
        box.dataset.status = item.status;
        box.style.position = 'absolute';
        box.style.left = item.rect.x + 'px';
        box.style.top = item.rect.y + 'px';
        box.style.width = item.rect.width + 'px';
        box.style.height = item.rect.height + 'px';
        box.style.border = '2px solid #2563eb';
        box.style.background = 'rgba(37,99,235,.06)';
        box.style.boxSizing = 'border-box';
        const marker = document.createElement('span');
        marker.textContent = String(item.marker_no);
        marker.style.cssText = 'position:absolute;left:-2px;top:-26px;min-width:24px;height:24px;padding:0 5px;border-radius:5px 5px 5px 0;background:#2563eb;color:white;font:600 13px/24px sans-serif;text-align:center';
        box.appendChild(marker);
        layer.appendChild(box);
      });
    }

    function rectForNode(node) {
      const canvas = node.closest('.runtime-canvas').getBoundingClientRect();
      const raw = node.getBoundingClientRect();
      const scale = canvas.width / 1920;
      return { x: (raw.left - canvas.left) / scale, y: (raw.top - canvas.top) / scale, width: raw.width / scale, height: raw.height / scale };
    }

    function chromeTargets(container, region) {
      return Array.from(container.querySelectorAll('[data-runtime-chrome]')).flatMap((node) => {
        const rect = rectForNode(node);
        if (region && !(rect.x >= region.x && rect.y >= region.y && rect.x + rect.width <= region.x + region.width && rect.y + rect.height <= region.y + region.height)) return [];
        return [{ type: node.dataset.runtimeChrome, placement: node.dataset.placement || '', style: node.dataset.chromeStyle || '', text: node.textContent || '', rect }];
      });
    }

    function finishSelection(selection) {
      state.selection.mode = 'none';
      postModeToInner();
      window.parent.postMessage({ type: 'selectionCreated', session_id: state.selection.sessionID, slide_id: state.selection.slideID, selection }, '*');
    }

    window.addEventListener('message', (event) => {
      const execution = Array.from(state.executions.values()).find(value =>
        value.container.querySelector('iframe').contentWindow === event.source);
      const message = event.data;
      if (execution && message?.bridge === 'ppt-theme-v1' && message.slide_id === execution.slideID) {
        const current = state.slides.find(slide => slide.id === execution.slideID);
        if (!current) return;
        if (message.type === 'themeBridgeReady') {
          execution.ready = true;
          sendVisibility(execution);
          requestAppearance(current, true, execution);
        } else if (message.request_id === execution.requestID
          && execution.requestedHash === (current.frame.appearance?.hash || 'unavailable')) {
          if (message.type === 'themeApplied' && message.appearance_hash === execution.requestedHash) {
            execution.appliedHash = message.appearance_hash;
            execution.error = null;
            applyRuntimeFrame(execution.container, current.frame);
            if (execution === state.activeExecution) {
              postModeToInner();
              window.parent.postMessage({type:'themeApplied',slide_id:current.id,appearance_hash:message.appearance_hash}, '*');
              prepareNeighbors();
            }
          } else if (message.type === 'themeApplyFailed') {
            execution.error = message.message;
            if (execution === state.activeExecution) window.parent.postMessage({type:'themeApplyFailed',slide_id:current.id,appearance_hash:current.frame.appearance?.hash || '',message:message.message}, '*');
          }
        }
        return;
      }
      const active = state.activeExecution?.container;
      if (execution && execution === state.activeExecution) {
        if (!message || message.bridge !== 'ppt-dom-selection-v1' || message.slide_id !== state.selection.slideID || message.session_id !== state.selection.sessionID) return;
        if (message.type === 'innerSelectionCreated') {
          const selection = message.selection;
          if (selection.kind === 'region') selection.chrome_targets = chromeTargets(active, selection.rect);
          if (validIncomingSelection(selection)) finishSelection(selection);
          else {
            window.parent.postMessage({ type: 'selectionRejected', session_id: message.session_id, slide_id: message.slide_id, message: '选择内容无效或过大，请缩小范围。' }, '*');
            postModeToInner();
          }
        } else if (message.type === 'innerSelectionEmpty') {
          window.parent.postMessage({ type: 'selectionEmpty', session_id: message.session_id, slide_id: message.slide_id, message: String(message.message || '未选中有效元素，请重试。') }, '*');
        } else if (message.type === 'innerSelectionRejected') {
          window.parent.postMessage({ type: 'selectionRejected', session_id: message.session_id, slide_id: message.slide_id, message: String(message.message || '选择内容无效，请重试。') }, '*');
        } else if (message.type === 'innerSelectionCanceled') {
          state.selection.mode = 'none';
          postModeToInner();
          window.parent.postMessage({ type: 'selectionCanceled', session_id: message.session_id, slide_id: message.slide_id }, '*');
        } else if (message.type === 'innerSelectionPresence' && Array.isArray(message.statuses)) {
          let unresolved=false;
          const statuses=message.statuses.map(item=>{
            if(item.needs_reselect)unresolved=true;
            if(!item.snapshot)return item;
            const snapshot=item.snapshot;
            const available=chromeTargets(active);
            const chrome=(snapshot.chrome_targets || []).map(old=>available.find(current=>current.type===old.type&&current.placement===old.placement));
            if(chrome.some(target=>!target)){unresolved=true;return {selection_id:item.selection_id,status:'content_deleted'};}
            snapshot.chrome_targets=chrome;
            const rects=[...(snapshot.dom_targets || []),...chrome].map(target=>target.rect);
            if(!rects.length){unresolved=true;return {selection_id:item.selection_id,status:'content_deleted'};}
            const x=Math.min(...rects.map(r=>r.x)),y=Math.min(...rects.map(r=>r.y));
            snapshot.rect={x,y,width:Math.max(...rects.map(r=>r.x+r.width))-x,height:Math.max(...rects.map(r=>r.y+r.height))-y};
            if(!validIncomingSelection(snapshot)){unresolved=true;return {selection_id:item.selection_id,status:'content_deleted'};}
            return item;
          });
          window.parent.postMessage({ type:'selectionPresence',session_id:message.session_id,slide_id:message.slide_id,statuses },'*');
          if(unresolved)window.parent.postMessage({type:'selectionRejected',session_id:message.session_id,slide_id:message.slide_id,message:'外观变化后部分选择无法可靠恢复，请重新选择。'},'*');
        }
        return;
      }
      if (event.source !== window.parent) {
        return;
      }

      try {
        if (isUpdateDeck(event.data)) {
          updateDeck(event.data.slides, event.data.index);
        } else if (isGotoSlide(event.data)) {
          renderSlide(event.data.index);
        } else if (event.data?.type === 'setPreviewVisibility' && typeof event.data.active === 'boolean') {
          state.visible = event.data.active;
          for (const execution of state.executions.values()) sendVisibility(execution);
        } else if (event.data?.type === 'retryTheme') {
          const current=state.slides[state.activeIndex];if(current?.id===event.data.slide_id)requestAppearance(current,true);
        } else if (isReplayCurrentSlide(event.data)) {
          const current = state.slides[state.activeIndex];
          if (current?.id === event.data.slide_id) renderSlide(state.activeIndex, true);
        } else if (isSelectionMode(event.data)) {
          const current = state.slides[state.activeIndex];
          if (!current || current.id !== event.data.slide_id) return;
          state.selection = { mode: event.data.mode, sessionID: event.data.session_id, slideID: event.data.slide_id, hash: event.data.html_hash };
          postModeToInner();
        } else if (isDraftRender(event.data) && event.data.session_id === state.selection.sessionID) {
          state.drafts.set(event.data.slide_id, event.data.selections.filter((item) => validRect(item.rect)));
          renderDrafts(event.data.slide_id);
        } else if (isSelectionProbe(event.data) && event.data.session_id === state.selection.sessionID) {
          const container = containerFor(event.data.slide_id);
          container?.querySelector('iframe')?.contentWindow?.postMessage({ bridge: 'ppt-dom-selection-v1', type: 'innerProbeSelections', slide_id: event.data.slide_id, session_id: event.data.session_id, selections: event.data.selections, refresh: event.data.refresh===true }, '*');
        }
      } catch (error) {
        window.parent.postMessage({
          type: 'renderError',
          message: error instanceof Error ? error.message : '未知渲染错误'
        }, '*');
      }
    });

    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => {
        const active = deck.querySelector('[data-slide-frame][data-active="true"]');
        const current = state.slides[state.activeIndex];
        if (active && current) fitCanvas(active, current.frame.canvas);
      }).observe(deck);
    }

    window.parent.postMessage({ type: 'runtimeReady' }, '*');
  </script>
</body>
</html>
