name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI 必经检查，对应 docs/80-dev/test-strategy.md「CI 必经检查」。
jobs:
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 纯 Go 栈（modernc.org/sqlite），禁用 cgo 走内部链接器。
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: backend/go.sum
      - name: gofmt (must be empty)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: verify wire is up to date
        run: |
          go run github.com/google/wire/cmd/wire@v0.6.0 ./cmd/server
          git diff --exit-code cmd/server/wire_gen.go

  frontend:
    name: frontend (ts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: tsc --noEmit
        run: pnpm tsc --noEmit
      - name: unit tests
        run: pnpm test

  contracts:
    name: contracts (schema + openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sqlite schema executes
        run: sqlite3 :memory: < docs/30-data-model/sqlite-schema.sql
      - name: openapi 3.1 lint
        run: npx --yes @redocly/cli@latest lint docs/40-api/openapi.yaml
