.state-controls button { font-size:11px; color:var(--muted); padding:3px 7px; border-radius:4px; }
.state-controls button[aria-pressed=true] { background:var(--hover); color:var(--ink); }
.state-controls button:hover { color:var(--ink); }
.card { background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.card-header { display:flex; align-items:center; padding:14px 14px 14px 16px; gap:12px; }
.summary { min-width:0; flex:1; text-align:left; padding:0; border-radius:4px; }

.identity { display:flex; align-items:center; flex-wrap:wrap; column-gap:7px; row-gap:3px; color:var(--muted); font-size:12px; line-height:18px; }
.identity .command-name { color:var(--text); }

.action:active { transform:translateY(1px); }

@keyframes spin { to { transform:rotate(360deg); } }

.demo-note { color:var(--muted); font-size:11px; margin:16px 0 0; }
.notice { min-height:20px; font-size:12px; color:var(--green); margin-top:12px; }

<main>

  <div class="demo-controls" aria-label="原型演示控制">

      <button type="button" data-state="completed">已完成</button>
      <button type="button" data-state="failed">失败</button>
      <button type="button" data-state="canceled">已停止</button>
    </div>
  </div>
  <article class="card" aria-label="命令活动">
    <div class="card-header">
      <button type="button" class="summary" id="summary" aria-controls="result">
        <span class="identity"><span id="command-icon"></span><span class="command-name" id="command-name"></span><time datetime="2026-09-22T16:51:00+08:00">09-22 16:51</time></span>
        <span class="card-title" id="card-title"></span>
      </button>
      <div class="header-action" id="header-action"></div>
    </div>
    <ol class="progress" id="progress" aria-label="命令阶段"></ol>
    <div class="result" id="result" hidden>
      <div class="result-copy" id="result-copy"></div>
      <div class="footer" id="footer">
        <form class="feedback" id="feedback">
          <label for="feedback-input" class="sr-only">调整建议</label>
          <input id="feedback-input" placeholder="调整建议（可选）" autocomplete="off" maxlength="4000">
        </form>
        <div class="footer-actions">
          <button type="button" class="action retry" id="retry-result"></button>
          <button type="button" class="action copy" id="copy"></button>
          <button type="button" class="action primary" id="primary"></button>
        </div>
      </div>
    </div>
  </article>
  <div class="stage-control"><button type="button" id="advance"></button></div>
  <p class="demo-note">示例内容。可切换状态、展开结果；操作仅在本页演示。</p>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <span class="sr-only" id="status-announcement" role="status" aria-live="polite"></span>
</main>

  polish: { icon:'Sparkles', running:'正在润色当前输入', completed:'明确命令组件的调整范围', failed:'输入润色失败', canceled:'输入润色已停止', steps:['理解意图','优化表达','生成建议'], revise:true, primary:'应用到输入框', body:'<p>请仅调整命令组件：统一运行、完成、失败和停止状态的容器，移除命令图标的大面积绿色背景，将当前阶段的闪烁圆点改为旋转指示。</p><p>保留命令名称、时间、结果展开，以及停止、重试和复制等操作。</p>', text:'请仅调整命令组件：统一运行、完成、失败和停止状态的容器，移除命令图标的大面积绿色背景，将当前阶段的闪烁圆点改为旋转指示。保留命令名称、时间、结果展开，以及停止、重试和复制等操作。' }
};
let kind='handoff', state='running', phase=2, expanded=false;
const $=id=>document.getElementById(id);
const icon=(name,spin=false)=>spin?'<span class="spin">'+icons[name]+'</span>':icons[name];
const tabs=document.querySelector('.command-tabs');
Object.keys(commands).forEach(key=>{
 const b=document.createElement('button'); b.type='button'; b.textContent=key; b.dataset.kind=key;
 b.addEventListener('click',()=>{ kind=key; phase=2; $('feedback-input').value=''; setState(state); }); tabs.append(b);
});
document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{ phase=2; setState(b.dataset.state); }));
function announce(text){ $('status-announcement').textContent=text; }
function setState(next){ state=next; expanded=next==='completed'; $('notice').textContent=''; render(); announce(commands[kind][state]); }
function retry(){ phase=0; setState('running'); }
function toggle(){ expanded=!expanded; render(); }
function actionButton(label, glyph, className, fn){
 const b=document.createElement('button'); b.type='button'; b.className='action '+className;
 b.innerHTML=icon(glyph)+(className==='disclosure'?'':label); b.setAttribute('aria-label',label); b.title=label;
 b.addEventListener('click',fn); return b;
}
function render(){
 const c=commands[kind];
 document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));
 document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));
 $('command-icon').innerHTML=icon(c.icon); $('command-name').textContent=kind; $('card-title').textContent=c[state];
 $('summary').disabled=state!=='completed';
 if(state==='completed') $('summary').setAttribute('aria-expanded',String(expanded)); else $('summary').removeAttribute('aria-expanded');
 const actions=$('header-action'); actions.replaceChildren();
 if(state==='running') actions.append(actionButton('停止','X','stop',()=>setState('canceled')));
 else if(state==='completed'){
   const b=actionButton(expanded?'收起结果':'展开结果',expanded?'ChevronDown':'ChevronRight','disclosure',toggle); b.setAttribute('aria-expanded',String(expanded)); b.setAttribute('aria-controls','result'); actions.append(b);
 } else actions.append(actionButton('重试','RefreshCw','retry',retry));
 $('progress').hidden=state!=='running';
 if(state==='running'){
   $('progress').innerHTML=c.steps.map((name,i)=>'<li class="step '+(i<phase?'done':i===phase?'current':'')+'"'+(i===phase?' aria-current="step"':'')+'><span class="step-top"><span class="step-icon">'+icon(i<phase?'Check':i===phase?'LoaderCircle':'Circle',i===phase)+'</span></span><span>'+name+'</span><span class="sr-only">'+(i<phase?'已完成':i===phase?'进行中':'尚未开始')+'</span></li>').join('');
 }
 $('result').hidden=state!=='completed'||!expanded;
 if(state==='completed'){
   $('result-copy').innerHTML=c.body;
   const more=$('more'); if(more) more.addEventListener('click',()=>{const open=$('long-copy').hidden; $('long-copy').hidden=!open; more.textContent=open?'收起长内容':'展开全部'; more.setAttribute('aria-expanded',String(open));});
 }
 $('feedback').hidden=!c.revise;
 $('retry-result').hidden=!c.revise;
 $('primary').hidden=!c.primary;
 $('primary').innerHTML=c.primary?icon(kind==='polish'?'Check':'MessageSquarePlus')+c.primary:'';
 $('advance').hidden=state!=='running';
 $('advance').innerHTML=(phase<2?'演示下一阶段':'演示完成')+icon('ChevronRight');
}
$('summary').addEventListener('click',toggle);
$('advance').addEventListener('click',()=>{if(phase<2){phase++;render();announce(commands[kind].steps[phase]+'，进行中');}else setState('completed');});
$('feedback').addEventListener('submit',e=>{e.preventDefault();retry();});
$('feedback-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.isComposing)e.preventDefault();});
$('retry-result').innerHTML=icon('RefreshCw')+'重试'; $('retry-result').addEventListener('click',retry);
$('copy').innerHTML=icon('Clipboard')+'复制';
$('copy').addEventListener('click',async()=>{
 const text=commands[kind].text;
 try { await navigator.clipboard.writeText(text); $('notice').textContent='已复制结果正文'; }
 catch { const area=document.createElement('textarea'); area.value=text; area.style.position='fixed'; area.style.opacity='0'; document.body.append(area); area.select(); const copied=document.execCommand('copy'); area.remove(); $('notice').textContent=copied?'已复制结果正文':'复制不可用，请选中正文复制'; }
});
$('primary').addEventListener('click',()=>{ $('notice').textContent=kind==='polish'?'已演示应用操作，实际输入框未修改':'已演示新建会话操作，实际会话未创建'; });
render();
</script>
</body>
