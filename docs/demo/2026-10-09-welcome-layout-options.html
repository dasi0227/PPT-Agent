<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>欢迎页排版方案</title>
  <link rel="stylesheet" href="../../frontend/public/interaction-tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: rgb(var(--ui-workspace)); color: rgb(var(--ui-foreground)); font-family: Aptos, Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .preview-tabs { position: sticky; top: 0; z-index: 20; display: flex; min-height: 60px; justify-content: center; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid rgb(var(--ui-border)); background: rgb(var(--ui-panel)); }
    .preview-tabs button { min-height: 36px; padding: 8px 16px; border: 0; border-radius: 6px; background: transparent; color: rgb(var(--ui-text-600)); font: inherit; font-size: 13px; cursor: pointer; }
    .preview-tabs button:is(:hover, :focus-visible) { background: rgb(var(--ui-hover)); color: rgb(var(--ui-foreground)); outline: none; }
    .preview-tabs button[aria-pressed="true"] { background: rgb(var(--ui-selected)); color: rgb(var(--ui-selected-foreground)); font-weight: 600; }
    .preview-tabs button:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
    html #ppt-welcome-options .welcome-stage, html #ppt-welcome-options .composition { min-height: max(640px, calc(100dvh - 60px)); }
    @media (max-width: 600px) { .preview-tabs { gap: 4px; padding-inline: 8px; flex-wrap: wrap; } .preview-tabs button { padding-inline: 10px; } }
  </style>
</head>
<body>

        <div class="composition">

              <span class="workspace-home-slogan-line">交给 <span class="workspace-home-dasi">Dasi</span> 就好了</span>

        <button class="appearance-toggle cursor-interaction" type="button" aria-label="切换颜色模式"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg></button>
        <div class="composition">
          <div class="workspace-home-copy">
            <h1 class="workspace-home-slogan">
              <span class="workspace-home-slogan-line"><span class="workspace-home-agent" data-text="Agent">Agent</span> 时代下的 <span class="workspace-home-ppt">PPT</span></span>
              <span class="workspace-home-slogan-line">交给 <span class="workspace-home-dasi">Dasi</span> 就好了</span>
            </h1>
            <button class="workspace-home-action cursor-interaction" type="button" data-project-picker>新建 / 打开项目</button>
          </div>
          <div class="brand-visual" aria-hidden="true">
            <img class="brand-character" data-logo alt="">
            <div class="workspace-home-slides" data-slides></div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <dialog class="project-picker" aria-label="新建或打开项目">
    <form method="dialog" class="picker-content">
      <div class="picker-heading"><span>新建 / 打开项目</span><button class="picker-close cursor-interaction" aria-label="关闭" type="submit"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>

</div>
<style>

  }
  #ppt-welcome-options[data-color-mode="light"] { color-scheme: light; }
  #ppt-welcome-options[data-color-mode="dark"] { color-scheme: dark; }
  #ppt-welcome-options *, #ppt-welcome-options *::before, #ppt-welcome-options *::after { box-sizing: border-box; }
  #ppt-welcome-options .welcome-stage { position: relative; min-height: 640px; overflow: hidden; isolation: isolate; background: var(--ppt-workspace); color: var(--ppt-foreground); --p-logo-scale: 1; --p-copy-scale: 1; }
  #ppt-welcome-options .composition { position: relative; display: grid; min-height: 640px; max-width: 1240px; margin-inline: auto; padding: 56px 48px; align-items: center; }
  #ppt-welcome-options .workspace-home-copy { position: relative; z-index: 4; min-width: 0; }
  #ppt-welcome-options .workspace-home-slogan { margin: 0 0 36px; font-size: calc(clamp(34px, 5.35cqw, 68px) * var(--p-copy-scale)); font-weight: 850; line-height: 1.15; letter-spacing: 0; }
  #ppt-welcome-options .brand-visual { position: relative; z-index: 2; }
  #ppt-welcome-options .brand-character { display: block; max-width: none; width: 100%; height: auto; object-fit: contain; transform: scale(var(--p-logo-scale)); transform-origin: center; }
  #ppt-welcome-options .appearance-toggle { position: absolute; top: 16px; right: 16px; z-index: 6; display: grid; width: 36px; height: 36px; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--ppt-text-600); }
  #ppt-welcome-options .appearance-toggle svg, #ppt-welcome-options .picker-close svg { width: 16px; height: 16px; }
  #ppt-welcome-options button { font-family: inherit; }
  #ppt-welcome-options button:is(:hover, :focus-visible) { background: var(--ppt-hover); color: var(--ppt-foreground); }
  #ppt-welcome-options button:focus-visible { outline: none; text-decoration: underline; text-underline-offset: 4px; }
  #ppt-welcome-options ::selection { background: var(--ppt-selected); }

  #ppt-welcome-options .layout-split .composition { grid-template-columns: 36% minmax(0, 1fr); column-gap: 36px; }
  #ppt-welcome-options .layout-split .brand-visual { width: 100%; margin-top: -12px; }
  #ppt-welcome-options .layout-split .brand-character { position: relative; z-index: 2; transform: translateY(-36px) scale(var(--p-logo-scale)); }
  #ppt-welcome-options .layout-split .workspace-home-slides { position: absolute; z-index: 1; bottom: -36px; left: -32px; width: 72%; transform: none; }

  #ppt-welcome-options .layout-center .composition { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 36px 32px 92px; }
  #ppt-welcome-options .layout-center .brand-visual { width: calc(240px * var(--p-logo-scale)); margin: -32px 0 24px; }
  #ppt-welcome-options .layout-center .brand-character { transform: none; }
  #ppt-welcome-options .layout-center .workspace-home-copy { text-align: center; }
  #ppt-welcome-options .layout-center .workspace-home-slogan { font-size: calc(clamp(34px, 5.6cqw, 68px) * var(--p-copy-scale)); margin-bottom: 32px; }
  #ppt-welcome-options .layout-center > .workspace-home-slides { position: absolute; z-index: 1; right: 16px; bottom: 18px; width: 24%; transform: none; }

  #ppt-welcome-options .layout-corner .composition { justify-items: center; padding: 60px 32px 228px; }
  #ppt-welcome-options .layout-corner .workspace-home-copy { text-align: center; }
  #ppt-welcome-options .layout-corner .workspace-home-slogan { font-size: calc(clamp(34px, 6cqw, 74px) * var(--p-copy-scale)); }
  #ppt-welcome-options .layout-corner > .brand-visual { position: absolute; z-index: 2; right: -12px; bottom: -24px; width: 39%; max-width: 490px; }
  #ppt-welcome-options .layout-corner > .workspace-home-slides { position: absolute; z-index: 1; left: 32px; bottom: 40px; width: 28%; max-width: 350px; transform: none; }

  #ppt-welcome-options .layout-studio .composition { grid-template-columns: minmax(0, 1fr) 37%; gap: 28px; }
  #ppt-welcome-options .layout-studio .workspace-home-slogan { font-size: calc(clamp(34px, 5.3cqw, 68px) * var(--p-copy-scale)); }
  #ppt-welcome-options .layout-studio .brand-visual { width: 100%; margin-top: -48px; }
  #ppt-welcome-options .layout-studio .brand-character { position: relative; z-index: 1; }
  #ppt-welcome-options .layout-studio .workspace-home-slides { position: absolute; z-index: 2; bottom: -96px; left: -44px; width: 108%; transform: none; }

  #ppt-welcome-options .project-picker { width: min(400px, calc(100% - 40px)); padding: 24px; border: 1px solid var(--ppt-border-strong); border-radius: 10px; background: var(--ppt-surface); color: var(--ppt-foreground); box-shadow: 0 12px 32px color-mix(in srgb, var(--ppt-shadow) 16%, transparent); }
  #ppt-welcome-options .project-picker::backdrop { background: color-mix(in srgb, var(--ppt-foreground) 24%, transparent); }
  #ppt-welcome-options .picker-content { display: grid; gap: 28px; }
  #ppt-welcome-options .picker-heading { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 600; }
  #ppt-welcome-options .picker-close { display: grid; width: 32px; height: 32px; place-items: center; background: transparent; color: var(--ppt-text-600); border: none; border-radius: 6px; }
  #ppt-welcome-options .picker-actions { display: flex; gap: 12px; }
  #ppt-welcome-options .picker-choice { flex: 1; padding: 12px; border: 1px solid var(--ppt-border-strong); background: var(--ppt-panel); color: var(--ppt-foreground); border-radius: 6px; font-size: 14px; }

  @scope (#ppt-welcome-options) {
    .workspace-home-slogan-line {
  display: block;
  white-space: nowrap;
}

.workspace-home-agent,
.workspace-home-ppt,
.workspace-home-dasi {
  color: var(--ppt-accent);
}

.workspace-home-ppt {
  display: inline-block;
  transform-origin: center bottom;
  animation: workspace-home-ppt-jitter 2s ease-in-out infinite;
}

.workspace-home-dasi {
  position: relative;
  display: inline-block;
}

.workspace-home-dasi::after {
  position: absolute;
  right: 0;
  bottom: -0.12em;
  left: 0;
  height: 0.07em;
  border-radius: 999px;
  background: currentColor;
  content: "";
  transform: scaleX(0.24);
  transform-origin: left;
  animation: workspace-home-dasi-underline 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
}

.workspace-home-agent {
  position: relative;
  display: inline-block;
}

@supports ((background-clip: text) or (-webkit-background-clip: text)) {
  .workspace-home-agent::after {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(
      100deg,
      transparent 0%,
      transparent 38%,
      var(--ppt-shimmer) 50%,
      transparent 62%,
      transparent 100%
    );
    background-size: 300% 100%;
    background-position: 130% 0;
    background-repeat: no-repeat;
    background-clip: text;
    color: transparent;
    content: attr(data-text);
    opacity: 0;
    pointer-events: none;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: workspace-home-agent-sweep 2s ease-in-out infinite;
  }
}

.workspace-home-action {
  display: inline-flex;
  height: 46px;
  align-items: center;
  justify-content: center;
  padding: 0 22px;
  border: 1px solid var(--ppt-border-strong);
  border-radius: 6px;
  background: var(--ppt-surface);
  box-shadow: 0 8px 18px color-mix(in srgb, var(--ppt-shadow) 11%, transparent);
  color: var(--ppt-foreground);
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
}


.workspace-home-slides {
  position: relative;
  width: 570px;
  aspect-ratio: 16 / 11;
  justify-self: end;
  transform: translateX(2%);
  perspective: 1000px;
}

.workspace-home-slide {
  position: absolute;
  width: 78%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border: 1px solid var(--ppt-border-strong);
  border-radius: 6px;
  background: var(--ppt-surface);
  box-shadow: 0 20px 50px color-mix(in srgb, var(--ppt-shadow) 16%, transparent);
  transform-origin: center;
}

.workspace-home-slide-back {
  top: 2%;
  right: 2%;
  opacity: 0.58;
  background: var(--ppt-panel);
  transform: rotate(8deg) translate3d(8%, 2%, -80px);
}

.workspace-home-slide-mid {
  top: 13%;
  right: 10%;
  opacity: 0.8;
  background: var(--ppt-surface);
  transform: rotate(2deg) translate3d(3%, 1%, -30px);
}

.workspace-home-slide-front {
  top: 25%;
  right: 18%;
  transform: rotate(-4deg);
  animation: workspace-home-slide-float 4.2s ease-in-out infinite;
}

.workspace-home-slide-title,
.workspace-home-slide-subtitle,
.workspace-home-slide-circle,
.workspace-home-slide-block {
  position: absolute;
}

.workspace-home-slide-title {
  top: 16%;
  left: 10%;
  width: 48%;
  height: 12%;
  border-radius: 3px;
  background: var(--ppt-foreground);
}

.workspace-home-slide-subtitle {
  top: 34%;
  left: 10%;
  width: 44%;
  height: 5%;
  border-radius: 2px;
  background: var(--ppt-border-strong);
}

.workspace-home-slide-circle {
  top: 13%;
  right: 11%;
  width: 14%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--ppt-accent);
}

.workspace-home-slide-block {
  right: 10%;
  bottom: 14%;
  width: 26%;
  height: 40%;
  border: 1px solid color-mix(in srgb, var(--ppt-accent) 24%, transparent);
  border-radius: 4px;
  background: var(--ppt-selected);
}

.workspace-home-chart {
  position: absolute;
  bottom: 14%;

<script>
  (() => {
    const root = document.getElementById('ppt-welcome-options');
    const logo = '../../frontend/public/logo.png';
    root.querySelectorAll('[data-logo]').forEach(img => { img.src = logo; });
    root.querySelectorAll('[data-slides]').forEach(stack => {
      ['back', 'mid', 'front'].forEach(layer => {
        const slide = document.createElement('div');
        slide.className = `workspace-home-slide workspace-home-slide-${layer}`;
        ['title', 'subtitle', 'circle', 'block'].forEach(part => {
          const shape = document.createElement('span');
          shape.className = `workspace-home-slide-${part}`;
          slide.append(shape);
        });
        const chart = document.createElement('span');
        chart.className = 'workspace-home-chart';
        for (let n = 0; n < 4; n++) chart.append(document.createElement('span'));
        slide.append(chart);
        stack.append(slide);
      });
    });
    root.querySelectorAll('.appearance-toggle').forEach(button => {
      button.addEventListener('click', () => {
        const scheme = getComputedStyle(root).colorScheme;
        const dark = root.dataset.colorMode === 'dark' || (!root.dataset.colorMode && (scheme === 'dark' || (scheme.includes('dark') && matchMedia('(prefers-color-scheme: dark)').matches)));
        root.dataset.colorMode = dark ? 'light' : 'dark';
        root.querySelectorAll('.appearance-toggle').forEach(toggle => {
          toggle.setAttribute('aria-label', dark ? '切换到暗色模式' : '切换到亮色模式');
          toggle.innerHTML = dark ? "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401\"></path></svg>" : "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"></circle><path d=\"M12 2v2\"></path><path d=\"M12 20v2\"></path><path d=\"m4.93 4.93 1.41 1.41\"></path><path d=\"m17.66 17.66 1.41 1.41\"></path><path d=\"M2 12h2\"></path><path d=\"M20 12h2\"></path><path d=\"m6.34 17.66-1.41 1.41\"></path><path d=\"m19.07 4.93-1.41 1.41\"></path></svg>";
        });
        if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16, 'stroke-width': 1.75 } });
      });
    });
    const picker = root.querySelector('.project-picker');
    root.querySelectorAll('[data-project-picker]').forEach(button => button.addEventListener('click', () => picker.showModal()));
    picker.addEventListener('click', event => { if (event.target === picker) picker.close(); });
    if (globalThis.Tweak) {
      root.querySelectorAll('.welcome-stage').forEach(stage => {
        const state = { logoScale: 1, copyScale: 1 };
        const render = () => {
          stage.style.setProperty('--p-logo-scale', state.logoScale);
          stage.style.setProperty('--p-copy-scale', state.copyScale);
        };
        const tweak = new Tweak({ container: stage, onChange: render });
        tweak.addSlider(state, 'logoScale', { label: 'Logo 大小', min: 0.85, max: 1.1, step: 0.05 });
        tweak.addSlider(state, 'copyScale', { label: '文案大小', min: 0.9, max: 1.03, step: 0.01 });
      });
    }
  })();
</script>

  <script>
    (() => {
      const root = document.getElementById('ppt-welcome-options');
      const variants = [...root.querySelectorAll('[data-variant]')];
      const buttons = [...document.querySelectorAll('[data-variant-index]')];
      const select = index => {
        variants.forEach((variant, n) => { variant.hidden = n !== index; });
        buttons.forEach((button, n) => button.setAttribute('aria-pressed', String(n === index)));
        history.replaceState(null, '', `#${index + 1}`);
      };
      buttons.forEach((button, n) => button.addEventListener('click', () => select(n)));
      const initial = Number(location.hash.slice(1)) - 1;
      select(Number.isInteger(initial) && initial >= 0 && initial < variants.length ? initial : 0);
      const syncAppearance = () => {
        document.documentElement.dataset.colorMode = root.dataset.colorMode || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      };
      syncAppearance();
      new MutationObserver(syncAppearance).observe(root, { attributes: true, attributeFilter: ['data-color-mode'] });
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncAppearance);
    })();
  </script>
