<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>范围选择器 · 聚焦原型</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --workspace: #e8edf4;
      --surface: #ffffff;
      --panel: #f7f9fc;
      --panel-muted: #eef2f7;
      --text: #17202b;
      --text-secondary: #526070;
      --text-muted: #7d8997;
      --border: #d7dee8;
      --border-strong: #c4ceda;
      --accent: #2f67f6;
      --accent-strong: #2556d8;
      --accent-soft: #eaf0ff;
      --accent-text: #214fc4;
      --focus: 0 0 0 3px rgba(47, 103, 246, .2);
      --font: Aptos, "SF Pro Text", "PingFang SC", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
    body {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: 18px;
      background: var(--workspace);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
    }
    button, textarea { color: inherit; font: inherit; }
    button { border: 0; cursor: pointer; background: transparent; }
    button:focus-visible, textarea:focus-visible { outline: 0; box-shadow: var(--focus); }
    ::selection { background: #cddaff; color: #102d72; }
    * { scrollbar-color: #c2ccd8 transparent; scrollbar-width: thin; }
    *::-webkit-scrollbar { width: 8px; }
    *::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 999px; background: #c2ccd8; background-clip: padding-box; }

    .agent-column {
      position: relative;
      display: grid;
      width: min(430px, 100%);
      height: min(800px, calc(100dvh - 36px));
      min-height: 660px;
      grid-template-rows: 50px minmax(0, 1fr) auto;
      overflow: hidden;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 14px 32px rgba(31, 42, 55, .16);
    }

    .agent-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 15px;
      border-bottom: 1px solid var(--border);
    }
    .agent-mark { display: grid; width: 25px; height: 25px; place-items: center; border-radius: 7px; background: var(--text); color: #fff; }
    .agent-mark svg { width: 14px; height: 14px; }
    .agent-head strong { font-size: 13px; }
    .agent-head span:last-child { margin-left: auto; color: var(--text-muted); font-size: 11px; }

    .conversation { min-height: 0; overflow-y: auto; padding: 19px 16px 180px; }
    .user-message { margin-left: 48px; padding: 10px 12px; border-radius: 12px 12px 3px 12px; background: var(--panel-muted); color: var(--text-secondary); font-size: 12.5px; line-height: 1.55; }
    .agent-message { display: flex; gap: 8px; margin-top: 20px; }
    .agent-message > svg { width: 15px; height: 15px; flex: none; margin-top: 2px; color: var(--accent); }
    .agent-message p { margin: 0; color: var(--text-secondary); font-size: 12.5px; line-height: 1.65; }

    .composer-zone { position: absolute; right: 12px; bottom: 12px; left: 12px; z-index: 10; }
    .window-stack {
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      display: flex;
      width: min(392px, calc(100vw - 48px));
      flex-direction: column;
      gap: 7px;
      align-items: stretch;
    }
    .floating-window {
      border: 1px solid var(--border-strong);
      border-radius: 13px;
      background: var(--surface);
      box-shadow: 0 11px 26px rgba(25, 37, 53, .15);
      animation: window-in .2s cubic-bezier(.16, 1, .3, 1) both;
    }
    @keyframes window-in {
      from { transform: translateY(6px) scale(.988); opacity: .35; filter: blur(2px); }
      to { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
    }
    @media (prefers-reduced-motion: reduce) { .floating-window { animation: none; } }

    .window-head { display: flex; min-height: 39px; align-items: center; gap: 8px; padding: 8px 10px 7px 13px; }
    .window-head strong { font-size: 12.5px; }
    .selection-count {
      min-width: 21px;
      border-radius: 999px;
      background: var(--accent-soft);
      padding: 2px 7px;
      color: var(--accent-text);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      text-align: center;
    }
    .icon-button { display: grid; width: 27px; height: 27px; margin-left: auto; place-items: center; border-radius: 7px; color: var(--text-muted); }
    .icon-button:hover { background: var(--panel-muted); color: var(--text); }
    .icon-button svg { width: 15px; height: 15px; }

    .selection-list { max-height: 242px; overflow-y: auto; border-top: 1px solid var(--border); padding: 6px; }
    .selection-row {
      display: grid;
      width: 100%;
      min-height: 36px;
      grid-template-columns: 17px 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border-radius: 8px;
      padding: 5px 8px;
      text-align: left;
    }
    .selection-row:hover { background: var(--panel); }
    .selection-row.selected { background: var(--accent-soft); color: var(--accent-text); }
    .checkbox {
      display: grid;
      width: 16px;
      height: 16px;
      place-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      background: var(--surface);
      color: #fff;
    }
    .checkbox svg { display: none; width: 11px; height: 11px; stroke-width: 2.7; }
    .selection-row.selected .checkbox { border-color: var(--accent); background: var(--accent); }
    .selection-row.selected .checkbox svg { display: block; }
    .ordinal { color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
    .selection-row.selected .ordinal { color: var(--accent-text); }
    .row-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; font-weight: 650; white-space: nowrap; }
    .row-count { color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .selection-row.selected .row-count { color: var(--accent-text); }

    .scope-window { padding: 13px; }
    .scope-head { display: flex; min-height: 27px; align-items: center; margin-bottom: 8px; }
    .scope-head strong { font-size: 13px; }
    .scope-row { display: grid; grid-template-columns: 38px minmax(0, 1fr); align-items: center; gap: 9px; margin-top: 8px; }
    .scope-row > span { color: var(--text-secondary); font-size: 12px; font-weight: 700; }
    .segmented { display: flex; min-width: 0; gap: 2px; border-radius: 999px; background: var(--panel-muted); padding: 3px; }
    .segment {
      min-width: 0;
      height: 28px;
      flex: 1;
      border-radius: 999px;
      padding: 0 7px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .segment:hover { color: var(--text); }
    .segment.active { background: var(--surface); color: var(--accent-text); box-shadow: 0 2px 7px rgba(31, 42, 55, .13); }
    .segment:disabled { cursor: not-allowed; color: #9aa5b2; }
    .segmented.locked .segment.active { color: var(--text-secondary); box-shadow: none; }

    .composer { border: 1px solid var(--border-strong); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 18px rgba(31, 42, 55, .14); }
    .composer textarea {
      display: block;
      width: 100%;
      min-height: 72px;
      resize: none;
      border: 0;
      border-radius: 18px 18px 0 0;
      background: transparent;
      padding: 13px 14px 8px;
      font-size: 12.5px;
      line-height: 1.55;
    }
    .composer textarea::placeholder { color: #8894a2; opacity: 1; }
    .composer textarea:focus-visible { box-shadow: none; }
    .composer-controls { display: flex; align-items: center; gap: 6px; padding: 0 8px 8px; }
    .composer-tool {
      display: inline-flex;
      height: 29px;
      align-items: center;
      gap: 5px;
      border-radius: 7px;
      padding: 0 8px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 650;
    }
    .composer-tool:hover, .composer-tool.active { background: var(--panel-muted); color: var(--text); }
    .composer-tool.active { box-shadow: inset 0 0 0 1px var(--border); }
    .composer-tool svg { width: 14px; height: 14px; }
    .target-summary { max-width: 172px; }
    .target-summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .send { display: grid; width: 29px; height: 29px; margin-left: auto; place-items: center; border-radius: 8px; background: var(--accent); color: #fff; }
    .send:hover { background: var(--accent-strong); }
    .send:disabled { cursor: not-allowed; background: #aebbd0; }
    .send svg { width: 15px; height: 15px; }

    @media (max-width: 520px) {
      body { padding: 0; }
      .agent-column { width: 100vw; height: 100dvh; min-height: 620px; border-radius: 0; box-shadow: none; }
      .window-stack { left: 0; width: auto; }
    }
  </style>
</head>
<body>
  <main class="agent-column">
    <header class="agent-head">
      <span class="agent-mark"><i data-lucide="sparkles"></i></span>
      <strong>PPT Agent</strong>
      <span>已连接</span>
    </header>

    <section class="conversation">
      <div class="user-message">统一第二章图表的视觉表达，并让重点数据更醒目。</div>
      <div class="agent-message">
        <i data-lucide="sparkles"></i>
        <p>我会先检查你选择的页面，再统一图表样式。</p>
      </div>
    </section>

    <div class="composer-zone">
      <div class="window-stack" id="windowStack">
        <section class="floating-window selection-window" id="selectionWindow">
          <header class="window-head">
            <strong id="selectionTitle">自选页</strong>
            <span class="selection-count" id="selectionCount">3</span>
            <button class="icon-button" id="closeSelection" aria-label="收起自选窗口"><i data-lucide="x"></i></button>
          </header>
          <div class="selection-list" id="selectionList"></div>
        </section>

        <section class="floating-window scope-window" id="scopeWindow">
          <header class="scope-head">
            <strong>任务范围</strong>
            <button class="icon-button" id="closeScope" aria-label="关闭任务范围"><i data-lucide="x"></i></button>
          </header>
          <div class="scope-row">
            <span>对象</span>
            <div class="segmented" id="objectSegments" role="group" aria-label="对象范围"></div>
          </div>
          <div class="scope-row">
            <span>页面</span>
            <div class="segmented" id="pageSegments" role="group" aria-label="页面范围"></div>
          </div>
        </section>
      </div>

      <div class="composer">
        <textarea placeholder="输入你的想法与目标">统一第二章图表的视觉表达，并让重点数据更醒目。</textarea>
        <div class="composer-controls">
          <button class="composer-tool"><i data-lucide="message-circle"></i>对话</button>
          <button class="composer-tool"><i data-lucide="wand-sparkles"></i>执行</button>
          <button class="composer-tool target-summary active" id="scopeTrigger" aria-expanded="true">
            <i data-lucide="crosshair"></i><span id="targetLabel">自选页 · 演示文稿</span>
          </button>
          <button class="send" id="sendButton" aria-label="发送"><i data-lucide="arrow-up"></i></button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const objects = [
      { id: 'spec', label: '设计稿' },
      { id: 'html', label: '幻灯片' },
      { id: 'presentation', label: '演示文稿' },
      { id: 'global', label: '全局资源' },
    ];
    const pageModes = [
      { id: 'current', label: '当前页' },
      { id: 'all', label: '全部页' },
      { id: 'selected', label: '自选页' },
      { id: 'section', label: '自选章' },
    ];
    const slides = [
      { id: 's1', number: 1, title: '从产品势能到增长飞轮' },
      { id: 's2', number: 2, title: '核心判断与年度目标' },
      { id: 's3', number: 3, title: '市场增长与结构变化' },
      { id: 's4', number: 4, title: '用户需求分层' },
      { id: 's5', number: 5, title: '产品战略地图' },
      { id: 's6', number: 6, title: '核心场景与价值主张' },
      { id: 's7', number: 7, title: '方案组合与路线图' },
      { id: 's8', number: 8, title: '增长渠道组合' },
      { id: 's9', number: 9, title: '关键指标拆解' },
      { id: 's10', number: 10, title: '季度作战节奏' },
      { id: 's11', number: 11, title: '资源配置与风险' },
      { id: 's12', number: 12, title: '行动清单' },
    ];
    const sections = [
      { id: 'sec1', title: '第一章 · 市场与机会', count: 3 },
      { id: 'sec2', title: '第二章 · 产品策略', count: 4 },
      { id: 'sec3', title: '第三章 · 增长计划', count: 3 },
      { id: 'sec4', title: '第四章 · 保障机制', count: 2 },
    ];

    const state = {
      object: 'presentation',
      pageMode: 'selected',
      scopeOpen: true,
      selectionOpen: true,
      selectedSlides: new Set(['s4', 's5', 's6']),
      selectedSections: new Set(),
    };

    const $ = (id) => document.getElementById(id);
    const isGlobal = () => state.object === 'global';
    const isCustom = () => state.pageMode === 'selected' || state.pageMode === 'section';
    const activeSelection = () => state.pageMode === 'selected' ? state.selectedSlides : state.selectedSections;
    const refreshIcons = () => { if (window.lucide) lucide.createIcons(); };

    function renderSegments() {
      $('objectSegments').innerHTML = objects.map((item) => `
        <button class="segment ${state.object === item.id ? 'active' : ''}" data-object="${item.id}">${item.label}</button>
      `).join('');

      $('pageSegments').classList.toggle('locked', isGlobal());
      $('pageSegments').innerHTML = pageModes.map((item) => `
        <button class="segment ${(isGlobal() ? item.id === 'all' : state.pageMode === item.id) ? 'active' : ''}"
          data-page-mode="${item.id}" ${isGlobal() && item.id !== 'all' ? 'disabled' : ''}>${item.label}</button>
      `).join('');

      document.querySelectorAll('[data-object]').forEach((button) => button.addEventListener('click', () => {
        state.object = button.dataset.object;
        if (isGlobal()) state.selectionOpen = false;
        render();
      }));

      document.querySelectorAll('[data-page-mode]').forEach((button) => button.addEventListener('click', () => {
        if (isGlobal()) return;
        const next = button.dataset.pageMode;
        state.selectionOpen = (next === 'selected' || next === 'section')
          ? (state.pageMode === next ? !state.selectionOpen : true)
          : false;
        state.pageMode = next;
        render();
      }));
    }

    function renderSelectionWindow() {
      $('selectionWindow').hidden = !state.scopeOpen || !state.selectionOpen || !isCustom() || isGlobal();
      if ($('selectionWindow').hidden) return;

      const selection = activeSelection();
      const pageSelection = state.pageMode === 'selected';
      $('selectionTitle').textContent = pageSelection ? '自选页' : '自选章';
      $('selectionCount').textContent = selection.size;
      $('selectionList').innerHTML = (pageSelection ? slides : sections).map((item) => `
        <button class="selection-row ${selection.has(item.id) ? 'selected' : ''}" data-selection-id="${item.id}">
          <span class="checkbox"><i data-lucide="check"></i></span>
          ${pageSelection ? `<span class="ordinal">${item.number}</span>` : '<span></span>'}
          <span class="row-title">${item.title}</span>
          ${pageSelection ? '' : `<span class="row-count">${item.count} 页</span>`}
        </button>
      `).join('');

      document.querySelectorAll('[data-selection-id]').forEach((button) => button.addEventListener('click', () => {
        const id = button.dataset.selectionId;
        selection.has(id) ? selection.delete(id) : selection.add(id);
        renderSelectionWindow();
        renderSummary();
        refreshIcons();
      }));
    }

    function renderSummary() {
      const effectivePageMode = isGlobal() ? 'all' : state.pageMode;
      const pageLabel = pageModes.find((item) => item.id === effectivePageMode)?.label ?? '当前页';
      const objectLabel = objects.find((item) => item.id === state.object)?.label ?? '演示文稿';
      $('targetLabel').textContent = `${pageLabel} · ${objectLabel}`;
      $('sendButton').disabled = !isGlobal() && isCustom() && activeSelection().size === 0;
    }

    function render() {
      $('windowStack').hidden = !state.scopeOpen;
      $('scopeTrigger').classList.toggle('active', state.scopeOpen);
      $('scopeTrigger').setAttribute('aria-expanded', String(state.scopeOpen));
      renderSegments();
      renderSelectionWindow();
      renderSummary();
      refreshIcons();
    }

    $('scopeTrigger').addEventListener('click', () => {
      state.scopeOpen = !state.scopeOpen;
      if (state.scopeOpen && isCustom() && !isGlobal()) state.selectionOpen = true;
      render();
    });
    $('closeScope').addEventListener('click', () => { state.scopeOpen = false; render(); });
    $('closeSelection').addEventListener('click', () => { state.selectionOpen = false; render(); });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (state.selectionOpen) state.selectionOpen = false;
      else state.scopeOpen = false;
      render();
    });

    render();
  </script>
</body>
</html>
