<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画布模式滑块</title>
<style>
/* Standalone component study, preserving the app palette and Lucide icons.
   DESIGN_VARIANCE: 3; MOTION_INTENSITY: 4; VISUAL_DENSITY: 4.
   Labels describe the current mode, on the side opposite the thumb. */
:root { color-scheme: light; --page: #f8f9fb; --track: #e8efff; --track-hover: #dfe9ff; --ink: #2859ca; --thumb: #fff; --shadow: 0 1px 4px rgb(55 81 125 / 14%); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--page); font-family: Aptos, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; }
main { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 24px; }
.mode-slider { --x: 0px; position: relative; width: 128px; height: 36px; flex: 0 0 128px; padding: 0; border: 0; border-radius: 999px; background: var(--track); color: var(--ink); font: inherit; cursor: pointer; user-select: none; touch-action: pan-y; -webkit-tap-highlight-color: transparent; }
.mode-slider:hover, .mode-slider:focus-visible { background: var(--track-hover); }
.mode-slider:focus { outline: none; }
.mode-slider:focus-visible .mode-label { text-decoration: underline; text-underline-offset: 4px; }
.thumb { position: absolute; left: 4px; top: 4px; width: 28px; height: 28px; border-radius: 50%; background: var(--thumb); box-shadow: var(--shadow); transform: translateX(var(--x)); transition: transform 260ms cubic-bezier(.22, 1, .36, 1); pointer-events: none; }
.mode-slider[data-dragging="true"] { cursor: grabbing; }
.mode-slider[data-dragging="true"] .thumb { transition: none; }
.mode-label { position: absolute; top: 0; width: 88px; height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 550; line-height: 1; white-space: nowrap; pointer-events: none; transition: opacity 120ms ease, transform 180ms cubic-bezier(.22, 1, .36, 1); }
.mode-label svg { flex: none; }
.label-when-left { left: 36px; opacity: 1; transform: translateX(0); }
.label-when-right { left: 4px; opacity: 0; transform: translateX(4px); }
.mode-slider[data-right="true"] .label-when-left { opacity: 0; transform: translateX(-4px); }
.mode-slider[data-right="true"] .label-when-right { opacity: 1; transform: translateX(0); }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #181e28; --track: #243653; --track-hover: #2b4163; --ink: #bed1ff; --thumb: #e5edfa; --shadow: 0 1px 4px rgb(9 18 33 / 24%); }
}
@media (prefers-reduced-motion: reduce) { .thumb, .mode-label { transition: none; } }
@media (max-width: 319px) { main { gap: 10px; padding: 16px; } }
</style>
</head>
<body>
<main aria-label="画布展示模式">
<button class="mode-slider" type="button" role="slider" aria-label="视图切换" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="设计稿" data-left="设计稿" data-right-label="幻灯片" data-right="false" title="切换为幻灯片">
  <span class="mode-label label-when-left" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg><span>设计稿</span></span>
  <span class="mode-label label-when-right" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-presentation" aria-hidden="true"><path d="M2 3h20"></path><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"></path><path d="m7 21 5-5 5 5"></path></svg><span>幻灯片</span></span>
  <span class="thumb" aria-hidden="true"></span>
</button>
<button class="mode-slider" type="button" role="slider" aria-label="形态切换" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="预览图" data-left="预览图" data-right-label="源文件" data-right="false" title="切换为源文件">
  <span class="mode-label label-when-left" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-app-window" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M10 4v4"></path><path d="M2 8h20"></path><path d="M6 4v4"></path></svg><span>预览图</span></span>
  <span class="mode-label label-when-right" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-pen" aria-hidden="true"><path d="M12.659 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v9.34"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10.378 12.622a1 1 0 0 1 3 3.003L8.36 20.637a2 2 0 0 1-.854.506l-2.867.837a.5.5 0 0 1-.62-.62l.836-2.869a2 2 0 0 1 .506-.853z"></path></svg><span>源文件</span></span>
  <span class="thumb" aria-hidden="true"></span>
</button>
</main>
<script>
for (const button of document.querySelectorAll('.mode-slider')) {
  const thumb = button.querySelector('.thumb');
  let value = 0;
  let drag = null;
  let suppressClick = false;
  const travel = () => button.clientWidth - thumb.offsetWidth - 8;
  function paint(position) {
    button.style.setProperty('--x', position + 'px');
    button.dataset.right = String(position > travel() / 2);
  }
  function commit(next) {
    value = next;
    paint(value * travel());
    button.setAttribute('aria-valuenow', String(value));
    button.setAttribute('aria-valuetext', value ? button.dataset.rightLabel : button.dataset.left);
    button.title = '切换为' + (value ? button.dataset.left : button.dataset.rightLabel);
  }
  button.addEventListener('click', event => {
    if (suppressClick && event.detail !== 0) { suppressClick = false; return; }
    suppressClick = false;
    commit(1 - value);
  });
  button.addEventListener('keydown', event => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
      event.preventDefault();
      commit(['ArrowRight', 'ArrowUp', 'End'].includes(event.key) ? 1 : 0);
    }
  });
  button.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0) return;
    suppressClick = false;
    button.focus({ preventScroll: true });
    const startPosition = new DOMMatrixReadOnly(getComputedStyle(thumb).transform).m41;
    drag = { id: event.pointerId, x: event.clientX, start: startPosition, position: startPosition, moved: false };
    button.setPointerCapture(event.pointerId);
  });
  button.addEventListener('pointermove', event => {
    if (!drag || drag.id !== event.pointerId) return;
    const delta = event.clientX - drag.x;
    if (Math.abs(delta) > 4) drag.moved = true;
    if (!drag.moved) return;
    button.dataset.dragging = 'true';
    drag.position = Math.max(0, Math.min(travel(), drag.start + delta));
    paint(drag.position);
  });
  button.addEventListener('pointerup', event => {
    if (!drag || drag.id !== event.pointerId) return;
    const finished = drag;
    drag = null;
    delete button.dataset.dragging;
    if (finished.moved) {
      suppressClick = true;
      commit(finished.position > travel() / 2 ? 1 : 0);
    }
    if (button.hasPointerCapture(event.pointerId)) button.releasePointerCapture(event.pointerId);
  });
  function cancel() {
    if (!drag) return;
    drag = null;
    delete button.dataset.dragging;
    commit(value);
  }
  button.addEventListener('pointercancel', cancel);
  button.addEventListener('lostpointercapture', cancel);
  commit(0);
}
</script>
</body>
</html>
