<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>编辑图标候选方案</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f7f9fc; color: #5e6a7d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 64px auto; padding: 0 32px; }
    h1 { margin: 0 0 48px; color: #273244; font-size: 28px; font-weight: 600; }
    ul { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 24px; margin: 0; padding: 0; list-style: none; }
    li { display: flex; min-height: 64px; align-items: center; gap: 14px; font-size: 14px; }
    svg { width: 22px; height: 22px; flex: none; }
    @media (max-width: 580px) {
      main { margin: 32px auto; padding: 0 24px; }
      h1 { margin-bottom: 36px; font-size: 24px; }
      ul { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
      li { gap: 10px; font-size: 13px; }
    }
    @media (max-width: 340px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>

  </main>
</body>
</html>
