<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>计划与上下文图标</title>
  <link rel="stylesheet" href="../../frontend/public/interaction-tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: rgb(var(--ui-surface)); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .toolbar { width: min(440px, calc(100vw - 24px)); height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: rgb(var(--ui-panel)); border: 1px solid rgb(var(--ui-border)); }
    .heading { display: flex; align-items: center; gap: 8px; color: rgb(var(--ui-foreground)); font-size: 14px; font-weight: 600; }
    .heading svg { width: 16px; height: 16px; color: rgb(var(--ui-accent)); }
    .actions { display: flex; align-items: center; gap: 2px; }
    button { position: relative; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: rgb(var(--ui-text-600)); cursor: pointer; }
    button:hover, button:focus-visible { background: rgb(var(--ui-hover)); outline: none; }
    svg { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .icon { position: absolute; width: 16px; height: 16px; left: 8px; top: 8px; }
    .value { position: absolute; right: -2px; bottom: -3px; padding: 0 2px; border-radius: 3px; background: rgb(var(--ui-panel)); font-size: 9px; line-height: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .plan .value { color: rgb(var(--ui-text-600)); }
    .context .value { color: rgb(var(--ui-text-600)); }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="heading">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8V4H8M2 14h2m16 0h2"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M9 13v2m6-2v2"/></svg>
      <span>智能体</span>
    </div>
    <div class="actions">
    <button class="plan" id="plan" aria-label="计划，已完成 2 / 6">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 5 2 2 4-4M13 6h8m-18 6 2 2 4-4m4 3h8M3 19l2 2 4-4m4 3h8"/></svg>
      <span class="value" id="plan-value">2/6</span>
    </button>
    <button class="context" id="context" aria-label="上下文，当前使用 38%">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 14 4-4M3.34 19a10 10 0 1 1 17.32 0"/></svg>
      <span class="value" id="context-value">38%</span>
    </button>
    <button aria-label="隐藏右侧对话">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18m-7-6 3-3-3-3"/></svg>
    </button>
    </div>
  </header>
  <script>
    const frames = [[2,38],[3,42],[4,47],[5,53],[6,58]];
    let index = 0;
    const plan = document.getElementById('plan');
    const context = document.getElementById('context');
    function render() {
      const [completed, percent] = frames[index];
      document.getElementById('plan-value').textContent = `${completed}/6`;
      document.getElementById('context-value').textContent = `${percent}%`;
      plan.setAttribute('aria-label', `计划，已完成 ${completed} / 6`);
      context.setAttribute('aria-label', `上下文，当前使用 ${percent}%`);
    }
    function advance() { index = (index + 1) % frames.length; render(); }
    plan.onclick = context.onclick = advance;
    setInterval(advance, 2800);
  </script>
</body>
</html>
