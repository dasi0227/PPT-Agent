 spec:{role:'how-to',key_message:'从一个清晰的使用场景出发，把重复工作写成可执行的 Skill。',layout:'左侧展示制作步骤，右侧呈现文件结构与示例。',elements:[{type:'list',intent:'展示定义场景、编写指令、添加资源、运行调试四个步骤。'},{type:'code',intent:'展示最小可用的 SKILL.md，包括名称、描述与执行步骤。'}]}
};
const storageKey='ppt-agent-management-prototype-20260926';
let data=structuredClone(initial),doc='manifest',view='structured',editing=null,menu=null,undo=null;
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&typeof saved.manifest?.title==='string'&&Array.isArray(saved.manifest.requirements)&&Array.isArray(saved.manifest.prohibitions)&&Array.isArray(saved.design?.layout_preferences)&&saved.design.decorations&&Array.isArray(saved.spec?.elements))data=saved}catch{}
const titles={manifest:'内容要求',design:'视觉要求',spec:'规格要求'};
const roles=[['','未设置'],['cover','封面'],['agenda','目录'],['context','背景'],['content','内容'],['definition','定义'],['evidence','论据'],['comparison','对比'],['example','案例'],['how-to','操作指引'],['transition','过渡'],['summary','总结'],['conclusion','结论']];
const placements=[['none','暂不展示'],['top-left','左上'],['top-center','顶部居中'],['top-right','右上'],['bottom-left','左下'],['bottom-center','底部居中'],['bottom-right','右下'],['left-edge','左侧边'],['right-edge','右侧边']];
const elementTypes=[['text','文本'],['list','列表'],['metric','指标'],['quote','引用'],['table','表格'],['chart','图表'],['diagram','图示'],['code','代码'],['asset','素材']];
const elementIcons={text:'Type',list:'List',metric:'Gauge',quote:'Quote',table:'Table2',chart:'ChartColumn',diagram:'Workflow',code:'Code2',asset:'Image'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>icons[name]||'';
const get=path=>path.split('.').reduce((o,k)=>o?.[k],data[doc]);
function set(path,value){const keys=path.split('.');const last=keys.pop();const target=keys.reduce((o,k)=>o[k],data[doc]);if(value===undefined)delete target[last];else target[last]=value}
function status(text,canUndo=false){$('#status').innerHTML=icon('Check')+`<span>${esc(text)}</span>`+(canUndo?'<button id="undo">撤销</button>':'');if(canUndo)$('#undo').onclick=()=>{if(!guard())return;const last=undo;undo=null;data[last.doc]=last.data;persist('已撤销删除');render()}}
function persist(text='已保存到此浏览器',canUndo=false){try{localStorage.setItem(storageKey,JSON.stringify(data));status(text,canUndo)}catch{status('浏览器存储不可用，修改仅在当前页面有效',canUndo)}}
function guard(){if(!editing)return true;status('请先保存或取消当前修改');$('#edit-input')?.focus();return false}
function editorMarkup(hideLabel=false){return `<form class="editor" id="edit-form"><label for="edit-input" class="${hideLabel?'visually-hidden':''}">${esc(editing.label)}</label>${editing.multiline?'<textarea id="edit-input" rows="3"></textarea>':'<input id="edit-input" type="text">'}<p class="error" id="edit-error" role="alert"></p><div class="editor-bottom"><button type="button" class="small-btn cancel" id="cancel-edit">取消</button><button type="submit" class="small-btn primary">保存</button></div></form>`}
function valueDisplay(path,label,value){return `<div class="value ${value?'':'empty-value'}"><span>${esc(value||'待填写')}</span><button type="button" class="icon-btn edit-icon" data-edit="${path}" data-label="${esc(label)}" aria-label="编辑${esc(label)}" title="编辑${esc(label)}">${icon('Pencil')}</button></div>`}
function field(label,path){return `<div class="field"><div class="label">${label}</div><div>${editing?.path===path&&!editing.add?editorMarkup(true):valueDisplay(path,label,get(path))}</div></div>`}
function picker(path,label,options){const current=get(path)||'';return `<button class="picker" data-pick="${path}" data-label="${esc(label)}" aria-label="${esc(label)}：${esc(options.find(o=>o[0]===current)?.[1]||'未设置')}" aria-haspopup="listbox" aria-expanded="false"><span>${esc(options.find(o=>o[0]===current)?.[1]||'未设置')}</span>${icon('ChevronDown')}</button>`}
function elementTypeButton(path,type){const label=elementTypes.find(([value])=>value===type)?.[1]||'文本';return `<button type="button" class="element-type" data-pick="${path}" data-label="元素类型" aria-label="${label}，切换元素类型" title="${label} · 切换类型" aria-haspopup="menu" aria-expanded="false">${icon(elementIcons[type]||'Type')}${icon('ChevronDown')}</button>`}
function list(label,path,object=false){
 const items=get(path);
 const rows=items.map((value,i)=>{
  const p=object?`${path}.${i}.intent`:`${path}.${i}`;
  const editingRow=editing?.path===p&&!editing.add;
  const rowContent=editingRow?editorMarkup():`${object?elementTypeButton(`${path}.${i}.type`,value.type):'<span class="bullet" aria-hidden="true"></span>'}<div>${valueDisplay(p,object?`元素 ${i+1} 内容`:`${label} ${i+1}`,object?value.intent:value)}</div><button class="icon-btn delete" data-delete="${path}" data-index="${i}" aria-label="删除${label}第 ${i+1} 项" title="删除">${icon('Trash2')}</button>`;
  return `<li class="item ${object?'element':''} ${editingRow?'editing':''}">${rowContent}</li>`;
 }).join('');
 const adding=editing?.add&&editing.list===path;
 const newRow=adding?`<li class="item editing">${editorMarkup()}</li>`:'';
 return `<section class="section"><div class="section-head"><h2>${label}</h2><button class="add" data-add="${path}" ${object&&items.length>=32?'disabled':''}>${icon('Plus')}新增</button></div>${items.length||adding?`<ul class="items" role="list" aria-label="${label}">${rows}${newRow}</ul>`:'<div class="empty">暂无条目</div>'}</section>`;
}
function structuredContent(){if(doc==='manifest')return `<section class="section"><div class="section-head"><h2>基本信息</h2></div>${field('演示标题','title')}${field('演示语言','language')}${field('演示目标','goal')}${field('目标受众','audience')}</section>${list('内容要求','requirements')}${list('内容限制','prohibitions')}`;
if(doc==='design')return `<section class="section"><div class="section-head"><h2>整体风格</h2></div>${field('视觉方向','direction')}</section>${list('排版偏好','layout_preferences')}<section class="section decoration"><div class="section-head"><h2>页面装饰</h2></div>${[['page_number','页码'],['section_title','章节标题'],['deck_title','演示标题'],['key_message','核心信息']].map(([key,label])=>`<div class="field"><div class="label">${label}</div><div class="picker-wrap">${picker('decorations.'+key,label,key==='page_number'?placements.slice(1):placements)}</div></div>`).join('')}</section>`;
return `<section class="section"><div class="section-head"><h2>页面信息</h2></div><div class="field"><div class="label">页面角色</div><div class="picker-wrap">${picker('role','页面角色',roles)}</div></div>${field('核心信息','key_message')}${field('布局建议','layout')}</section>${list('内容元素','elements',true)}`}
function rawData(){return doc==='spec'?{sli_skill_steps:data.spec}:data[doc]}
function codeView(){const lines=JSON.stringify(rawData(),null,2).split('\n');const highlighted=lines.map((line,i)=>{let out='',cursor=0;const re=/"(?:\\.|[^"\\])*"\s*:|"(?:\\.|[^"\\])*"|\b(?:true|false|null|\d+)\b/g;for(const m of line.matchAll(re)){out+=esc(line.slice(cursor,m.index));out+=`<span class="${m[0].endsWith(':')?'key':m[0][0]==='"'?'string':'literal'}">${esc(m[0])}</span>`;cursor=m.index+m[0].length}return `<div class="code-line"><span class="line-number" aria-hidden="true">${i+1}</span><code class="code-text">${out+esc(line.slice(cursor))}</code></div>`}).join('');return `<div class="code-shell"><div class="code-toolbar"><span>只读预览</span><button id="copy">${icon('Copy')}复制</button></div><div class="code-scroll" tabindex="0" aria-label="JSON 只读内容">${highlighted}</div></div>`}
function render(){closeMenu();document.querySelectorAll('[data-doc]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.doc===doc));b.tabIndex=b.dataset.doc===doc?0:-1});$('#panel').setAttribute('aria-labelledby','tab-'+doc);$('#title').textContent=titles[doc];$('#doc-icon').innerHTML=icon(doc==='manifest'?'FileText':doc==='design'?'Palette':'ClipboardCheck');$('#json-toggle').innerHTML=icon('Braces')+'JSON';$('#json-toggle').setAttribute('aria-pressed',view==='raw');$('#json-toggle').title=view==='raw'?'返回内容视图':'查看 JSON';$('#content').innerHTML=view==='structured'?structuredContent():codeView();bindContent();if(editing)bindEditor()}
const limits={title:200,language:32,goal:1200,audience:600,direction:600,layout:80,key_message:500,requirements:300,prohibitions:300,layout_preferences:600,elements:1200};
function begin(path,label,add=false){if(!guard())return;const listKey=path.split('.')[0];const multiline=!['title','language','layout'].includes(path);editing={path,label,add,list:listKey,multiline,value:add?'':get(path)||'',min:path==='language'?2:['direction','layout'].includes(path)?0:1,max:limits[listKey]||600};render();$('#edit-input').focus()}
function bindEditor(){const input=$('#edit-input');input.value=editing.value;input.maxLength=editing.max;input.setAttribute('aria-describedby','edit-error');input.oninput=()=>{editing.value=input.value;$('#edit-error').textContent='';input.removeAttribute('aria-invalid')};$('#cancel-edit').onclick=cancelEdit;$('#edit-form').onsubmit=e=>{e.preventDefault();saveEdit()};input.onkeydown=e=>{if(e.isComposing)return;if(e.key==='Escape'){e.preventDefault();cancelEdit()}else if(e.key==='Enter'&&(!editing.multiline||e.metaKey||e.ctrlKey)){e.preventDefault();saveEdit()}}}
function returnFocus(e){const buttons=[...document.querySelectorAll(e.add?'[data-add]':'[data-edit]')];buttons.find(b=>(e.add?b.dataset.add:b.dataset.edit)===(e.add?e.list:e.path))?.focus()}
function cancelEdit(){const prev=editing;editing=null;render();status('已取消修改');returnFocus(prev)}
function saveEdit(){const value=$('#edit-input').value.trim();if(value.length<editing.min){$('#edit-error').textContent=editing.min===2?'请至少填写 2 个字符。':'请填写内容后再保存。';$('#edit-input').setAttribute('aria-invalid','true');$('#edit-input').focus();return false}const prev=editing;if(prev.add)get(prev.list).push(prev.list==='elements'?{type:'text',intent:value}:value);else set(prev.path,prev.path==='layout'&&!value?undefined:value);editing=null;undo=null;persist();render();returnFocus(prev);return true}
function bindContent(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>begin(b.dataset.edit,b.dataset.label));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>begin(`${b.dataset.add}.${get(b.dataset.add).length}${b.dataset.add==='elements'?'.intent':''}`,b.dataset.add==='elements'?'新增内容元素':'新增条目',true));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!guard())return;undo={doc,data:structuredClone(data[doc])};get(b.dataset.delete).splice(Number(b.dataset.index),1);persist('已删除条目',true);render();document.querySelector(`[data-add="${b.dataset.delete}"]`)?.focus()});document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(guard())openMenu(b)});const copy=$('#copy');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(rawData(),null,2));status('JSON 已复制')}catch{const input=document.createElement('textarea');input.value=JSON.stringify(rawData(),null,2);input.setAttribute('aria-label','复制 JSON');input.style.cssText='position:fixed;left:-9999px';document.body.append(input);input.select();let copied=false;try{copied=document.execCommand('copy')}catch{}input.remove();copy.focus();status(copied?'JSON 已复制':'复制不可用，请手动选择 JSON 内容')}}}
function closeMenu(focus=false){if(!menu)return;const trigger=menu.trigger;menu.el.remove();menu=null;trigger.setAttribute('aria-expanded','false');if(focus)trigger.focus()}
function openMenu(trigger){if(menu?.trigger===trigger){closeMenu(true);return}closeMenu();const path=trigger.dataset.pick;const isElement=path.endsWith('.type');const options=path==='role'?roles:path.endsWith('.type')?elementTypes:path==='decorations.page_number'?placements.slice(1):placements;const el=document.createElement('div');el.className='menu';el.setAttribute('role',isElement?'menu':'listbox');el.setAttribute('aria-label',trigger.dataset.label);el.id='enum-options';trigger.setAttribute('aria-controls',el.id);trigger.setAttribute('aria-expanded','true');el.innerHTML=options.map(([v,l])=>`<button class="option" role="${isElement?'menuitemradio':'option'}" ${isElement?'aria-checked':'aria-selected'}="${(get(path)||'')===v}" data-value="${v}"><span class="option-label">${isElement?icon(elementIcons[v]):''}${l}</span>${(get(path)||'')===v?icon('Check'):''}</button>`).join('');document.body.append(el);menu={el,trigger};const rect=trigger.getBoundingClientRect();const menuWidth=isElement?176:rect.width;el.style.width=menuWidth+'px';el.style.left=Math.max(8,Math.min(rect.left,innerWidth-menuWidth-8))+'px';const height=Math.min(el.scrollHeight,280);const below=innerHeight-rect.bottom-14;const above=rect.top-14;const up=below<height&&above>below;el.style.maxHeight=Math.max(80,Math.min(height,up?above:below))+'px';el.style.top=(up?Math.max(8,rect.top-Math.min(height,above)-6):rect.bottom+6)+'px';const buttons=[...el.querySelectorAll('button')];buttons.forEach(b=>b.onclick=()=>{set(path,path==='role'&&!b.dataset.value?undefined:b.dataset.value);closeMenu();undo=null;persist();render();[...document.querySelectorAll('[data-pick]')].find(b=>b.dataset.pick===path)?.focus()});(el.querySelector('[aria-selected=true],[aria-checked=true]')||buttons[0]).focus();let query='',timer;el.onkeydown=e=>{let index=buttons.indexOf(document.activeElement);if(e.key==='Escape'){e.preventDefault();closeMenu(true)}else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();index=e.key==='Home'?0:e.key==='End'?buttons.length-1:(index+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[index].focus()}else if(e.key==='Tab'){e.preventDefault();closeMenu(true)}else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){query+=e.key;clearTimeout(timer);timer=setTimeout(()=>query='',600);buttons.find(b=>b.textContent.trim().startsWith(query))?.focus()}}}
document.addEventListener('pointerdown',e=>{if(menu&&!menu.el.contains(e.target)&&!menu.trigger.contains(e.target))closeMenu()});window.addEventListener('resize',()=>closeMenu());document.addEventListener('scroll',e=>{if(menu&&!menu.el.contains(e.target))closeMenu()},true);
document.querySelectorAll('[data-doc]').forEach(b=>{b.onclick=()=>{if(!guard())return;doc=b.dataset.doc;undo=null;render();status('修改按字段独立保存')};b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();if(!guard())return;const tabs=[...document.querySelectorAll('[data-doc]')];const i=tabs.indexOf(b);const target=tabs[e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];target.click();target.focus()}});
$('#json-toggle').onclick=()=>{if(guard()){view=view==='structured'?'raw':'structured';render()}};
render();status('点击铅笔图标编辑');
</script>
