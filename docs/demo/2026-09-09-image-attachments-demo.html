<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片附件入口 · 右栏聚焦原型</title>
  <style>
    :root {
      color-scheme: light;
      --workspace: #e8edf4;
      --surface: #ffffff;
      --panel: #f7f9fc;
      --panel-muted: #eef2f7;
      --text: #17202b;
      --text-secondary: #526070;
      --text-muted: #7d8997;
      --border: #d7dee8;
      --border-strong: #c4ceda;
      --accent: #2f67f6;
      --accent-strong: #2556d8;
      --accent-soft: #eaf0ff;
      --success: #16845b;
      --success-soft: #e6f6ef;
      --focus: 0 0 0 3px rgba(47, 103, 246, .2);
      --font: Aptos, "SF Pro Text", "PingFang SC", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
    body {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: 18px;
      background: var(--workspace);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
    }
    button, textarea { color: inherit; font: inherit; }
    button { border: 0; cursor: pointer; background: transparent; }
    button:focus-visible, textarea:focus-visible { outline: 0; box-shadow: var(--focus); }
    ::selection { background: #cddaff; color: #102d72; }

    .agent-column {
      position: relative;
      display: grid;
      width: min(430px, 100%);
      height: min(760px, calc(100dvh - 36px));
      min-height: 600px;
      grid-template-rows: 50px minmax(0, 1fr) auto;
      overflow: hidden;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 14px 32px rgba(31, 42, 55, .16);
    }
    .agent-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 15px;
      border-bottom: 1px solid var(--border);
    }
    .agent-mark {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border-radius: 7px;
      background: var(--text);
      color: #fff;
    }
    .agent-mark svg { width: 14px; height: 14px; }
    .agent-head strong { font-size: 13px; }
    .agent-head span:last-child { margin-left: auto; color: var(--text-muted); font-size: 11px; }

    .conversation {
      min-height: 0;
      overflow: hidden;
      padding: 19px 16px 210px;
      background:
        linear-gradient(rgba(255, 255, 255, .82), rgba(255, 255, 255, .94)),
        radial-gradient(circle at 78% 72%, rgba(47, 103, 246, .08), transparent 36%);
    }
    .user-message {
      margin-left: 56px;
      padding: 10px 12px;
      border-radius: 12px 12px 3px 12px;
      background: var(--panel-muted);
      color: var(--text-secondary);
      font-size: 12.5px;
      line-height: 1.55;
    }
    .agent-message { display: flex; gap: 8px; margin-top: 20px; }
    .agent-dot {
      width: 15px;
      height: 15px;
      flex: none;
      margin-top: 2px;
      border: 4px solid var(--accent-soft);
      border-radius: 50%;
      background: var(--accent);
    }
    .agent-message p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 12.5px;
      line-height: 1.65;
    }
    .prototype-note {
      position: absolute;
      bottom: 164px;
      left: 50%;
      width: max-content;
      max-width: calc(100% - 30px);
      transform: translateX(-50%);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      padding: 5px 10px;
      color: var(--text-muted);
      font-size: 10.5px;
      box-shadow: 0 3px 12px rgba(31,42,55,.06);
      backdrop-filter: blur(7px);
    }
    .prototype-note.hidden { display: none; }

    .composer-zone {
      position: absolute;
      right: 12px;
      bottom: 12px;
      left: 12px;
      z-index: 10;
    }
    .hint {
      display: flex;
      min-height: 25px;
      align-items: center;
      justify-content: center;
      margin-bottom: 7px;
      color: var(--text-muted);
      font-size: 10.5px;
      opacity: 0;
      transform: translateY(3px);
      transition: opacity .16s ease, transform .16s ease;
      pointer-events: none;
    }
    .hint.visible { opacity: 1; transform: translateY(0); }
    .composer {
      overflow: hidden;
      border: 1px solid rgba(196, 206, 218, .9);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 6px 20px rgba(15, 23, 42, .08);
    }
    .composer textarea {
      display: block;
      width: 100%;
      min-height: 88px;
      resize: none;
      border: 0;
      background: transparent;
      padding: 14px 15px 9px;
      font-size: 13px;
      line-height: 1.55;
    }
    .composer textarea::placeholder { color: #8894a2; opacity: 1; }
    .composer textarea:focus-visible { box-shadow: none; }

    .attachments {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 12px 10px;
      scrollbar-width: none;
    }
    .attachments:empty { display: none; }
    .attachments::-webkit-scrollbar { display: none; }
    .attachment {
      position: relative;
      display: grid;
      width: 174px;
      min-width: 0;
      flex: 0 0 174px;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      padding: 6px 28px 6px 6px;
      box-shadow: 0 1px 2px rgba(31, 42, 55, .04);
      animation: attachment-in .2s cubic-bezier(.16, 1, .3, 1) both;
    }
    @keyframes attachment-in {
      from { transform: translateY(3px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .thumb {
      position: relative;
      width: 42px;
      height: 42px;
      overflow: hidden;
      border-radius: 7px;
      background: #dce5f1;
    }
    .thumb.brand {
      background:
        linear-gradient(145deg, transparent 0 55%, rgba(255,255,255,.18) 55% 59%, transparent 59%),
        linear-gradient(145deg, #132238 0 47%, #316cf4 47% 100%);
    }
    .thumb.brand::after {
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255,255,255,.88);
      border-radius: 50%;
      content: "";
    }
    .thumb.product {
      background:
        radial-gradient(circle at 62% 38%, #ffffff 0 9%, transparent 10%),
        linear-gradient(135deg, #e9efe8 0 50%, #c8dbc9 50% 100%);
    }
    .thumb.product::after {
      position: absolute;
      left: 11px;
      bottom: 7px;
      width: 20px;
      height: 25px;
      border-radius: 8px 8px 5px 5px;
      background: #5b7461;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.28);
      content: "";
    }
    .attachment-copy { min-width: 0; }
    .attachment-name {
      overflow: hidden;
      color: var(--text);
      font-size: 11.5px;
      font-weight: 650;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .attachment-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1;
    }
    .ready-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 2px var(--success-soft);
    }
    .remove {
      position: absolute;
      top: 5px;
      right: 5px;
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 6px;
      color: var(--text-muted);
    }
    .remove:hover { background: var(--panel-muted); color: var(--text); }
    .remove svg { width: 12px; height: 12px; }

    .composer-controls {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px 9px;
    }
    .control-start, .control-end {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 3px;
    }
    .control-end { margin-left: auto; }
    .icon-button, .tool-button, .send {
      display: inline-flex;
      height: 28px;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      color: var(--text-secondary);
    }
    .icon-button { width: 28px; flex: 0 0 28px; }
    .icon-button:hover, .icon-button.active, .tool-button:hover {
      background: var(--panel-muted);
      color: var(--text);
    }
    .icon-button.active {
      color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .icon-button svg, .tool-button svg, .send svg { width: 15px; height: 15px; }
    .tool-button {
      gap: 5px;
      padding: 0 7px;
      font-size: 10.5px;
      font-weight: 650;
    }
    .tool-button.model {
      max-width: 118px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .send {
      width: 28px;
      flex: 0 0 28px;
      background: var(--accent);
      color: #fff;
    }
    .send:hover { background: var(--accent-strong); }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }
    }
    @media (max-width: 520px) {
      body { padding: 0; }
      .agent-column {
        width: 100vw;
        height: 100dvh;
        min-height: 560px;
        border-radius: 0;
        box-shadow: none;
      }
      .attachment { width: 166px; flex-basis: 166px; }
      .tool-button.mode span, .tool-button.target span { display: none; }
      .tool-button.mode, .tool-button.target { width: 28px; padding: 0; }
    }
  </style>
</head>
<body>
  <main class="agent-column">
    <header class="agent-head">
      <span class="agent-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="m12 3 1.7 4.3L18 9l-4.3 1.7L12 15l-1.7-4.3L6 9l4.3-1.7L12 3Z"/>
          <path d="m19 14 .9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14Z"/>
        </svg>
      </span>
      <strong>PPT Agent</strong>
      <span>已连接</span>
    </header>

    <section class="conversation" aria-label="对话示意">
      <div class="prototype-note">点击输入框左下角的回形针</div>
      <div class="user-message">请延续这套品牌的视觉语言，并把产品图放到首页。</div>
      <div class="agent-message">
        <span class="agent-dot" aria-hidden="true"></span>
        <p>把品牌参考和产品图加到下一条消息，我会结合图片创作。</p>
      </div>
    </section>

    <div class="composer-zone">
      <div class="hint" id="hint" aria-live="polite"></div>
      <section class="composer" aria-label="Agent 输入框">
        <textarea id="prompt" placeholder="输入你的想法与目标">参考品牌图的色彩和构图，把产品图用在封面。</textarea>
        <div class="attachments" id="attachments" aria-label="当前消息的图片附件"></div>

        <div class="composer-controls">
          <div class="control-start">
            <button class="icon-button" id="attachButton" type="button"
              aria-label="选择图片" title="选择图片" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m20.5 11.5-8.9 8.9a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 0 1 5.7 5.7l-9.6 9.6a2 2 0 0 1-2.8-2.8l8.9-8.9"/>
              </svg>
            </button>
            <button class="tool-button mode" type="button" aria-label="交互模式">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="M7 8h10M7 12h6"/>
                <path d="M21 12a8 8 0 0 1-8 8H7l-4 2 1.4-4.2A9 9 0 1 1 21 12Z"/>
              </svg>
              <span>对话</span>
            </button>
          </div>
          <div class="control-end">
            <button class="tool-button target" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="7"/>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
              </svg>
              <span>当前页</span>
            </button>
            <button class="tool-button model" type="button">视觉模型</button>
            <button class="send" type="button" aria-label="发送" title="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m5 12 7-7 7 7M12 19V5"/>
              </svg>
            </button>
          </div>
        </div>
      </section>
      <span class="visually-hidden" id="live" aria-live="polite"></span>
    </div>
  </main>

  <template id="attachmentTemplate">
    <article class="attachment">
      <div class="thumb" aria-hidden="true"></div>
      <div class="attachment-copy">
        <div class="attachment-name"></div>
        <div class="attachment-meta">
          <span class="ready-dot"></span>
          <span class="meta-copy"></span>
        </div>
      </div>
      <button class="remove" type="button" aria-label="移除附件"
        title="移除当前消息引用">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>
    </article>
  </template>

  <script>
    const mockFiles = [
      { id: "brand", name: "品牌视觉参考.webp", size: "1.8 MB", kind: "brand" },
      { id: "product", name: "桌面端产品图.png", size: "2.4 MB", kind: "product" }
    ];
    const state = { attachments: [] };
    const attachmentList = document.getElementById("attachments");
    const attachButton = document.getElementById("attachButton");
    const template = document.getElementById("attachmentTemplate");
    const hint = document.getElementById("hint");
    const live = document.getElementById("live");
    const prototypeNote = document.querySelector(".prototype-note");

    function render() {
      attachmentList.replaceChildren();
      state.attachments.forEach(function (file) {
        const fragment = template.content.cloneNode(true);
        const card = fragment.querySelector(".attachment");
        const thumb = fragment.querySelector(".thumb");
        const name = fragment.querySelector(".attachment-name");
        const meta = fragment.querySelector(".meta-copy");
        const remove = fragment.querySelector(".remove");
        thumb.classList.add(file.kind);
        name.textContent = file.name;
        name.title = file.name;
        meta.textContent = file.size + " · 可用";
        remove.setAttribute("aria-label", "移除 " + file.name);
        remove.addEventListener("click", function () {
          state.attachments = state.attachments.filter(function (item) {
            return item.id !== file.id;
          });
          live.textContent = "已解除 " + file.name + " 的当前消息引用，项目文件仍保留";
          render();
        });
        attachmentList.appendChild(card);
      });

      const count = state.attachments.length;
      attachButton.classList.toggle("active", count > 0);
      attachButton.setAttribute("aria-pressed", String(count > 0));
      hint.classList.toggle("visible", count > 0);
      prototypeNote.classList.toggle("hidden", count > 0);
      hint.textContent = count > 0
        ? "已选择 " + count + " 张图片 · 移除只解除本次引用"
        : "";
    }

    attachButton.addEventListener("click", function () {
      state.attachments = mockFiles.map(function (file) {
        return Object.assign({}, file);
      });
      live.textContent = "已选择并上传 2 张图片";
      render();
    });

    document.getElementById("prompt").addEventListener("paste", function (event) {
      const items = Array.from(event.clipboardData.items);
      const hasImage = items.some(function (item) {
        return item.type.startsWith("image/");
      });
      if (!hasImage) return;
      event.preventDefault();
      state.attachments = mockFiles.map(function (file) {
        return Object.assign({}, file);
      });
      live.textContent = "已从剪贴板加入 2 张图片";
      render();
    });

    render();
  </script>
</body>
</html>
