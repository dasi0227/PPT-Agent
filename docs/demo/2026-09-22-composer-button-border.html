<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>输入栏按钮边框对比</title><style>
:root{color-scheme:light;--panel:#f8f9fb;--muted:#f0f3f7;--border:#d5dbe3;--text:#5f6b7a;--ink:#17202b;--accent:#2f67f6;--soft:#e8efff}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--panel);color:var(--ink);font-family:Aptos,Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;display:grid;align-items:center;padding:48px 24px}main{width:100%;max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px}section{min-width:0}h2{margin:0 0 20px 12px;font-size:13px;font-weight:500;color:var(--text)}.composer{border:1px solid rgb(213 219 227 / .8);border-radius:22px;background:var(--panel);box-shadow:0 6px 20px rgb(15 23 42 / .06)}textarea{display:block;width:100%;height:60px;min-height:60px;resize:none;border:0;border-radius:22px 22px 0 0;background:transparent;padding:12px 48px 12px 12px;font:400 14px/20px inherit;font-family:inherit;font-size:14px;line-height:20px;color:var(--ink);caret-color:var(--accent);outline:none}textarea::placeholder{color:#95a0ae;opacity:1}textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px 8px}.group{display:flex;align-items:center;gap:2px;min-width:0}button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.tool,.send{height:28px;min-width:28px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:6px;color:var(--text);background:transparent;border:1px solid var(--border);padding:0;gap:0;font-size:11px;font-weight:500;transition:gap 220ms cubic-bezier(.2,.8,.2,1),padding 220ms cubic-bezier(.2,.8,.2,1),background-color 150ms,color 150ms}.flat .tool{border-color:transparent}.tool svg,.send svg{flex-shrink:0}.label{display:inline-block;max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transform:translateX(-3px);transition:max-width 220ms cubic-bezier(.2,.8,.2,1),opacity 180ms ease-out,transform 220ms cubic-bezier(.2,.8,.2,1)}.tool:is(:hover,:focus-visible){background:var(--muted);color:var(--ink);gap:2px;padding-inline:4px}.tool.wide:is(:hover,:focus-visible){gap:4px;padding-inline:8px}.tool:is(:hover,:focus-visible) .label{max-width:64px;opacity:1;transform:translateX(0)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.tool[aria-pressed="true"]{background:var(--soft);color:var(--accent)}.framed .tool[aria-pressed="true"]{border-color:rgb(47 103 246 / .3)}.send{width:28px;border-color:transparent;background:var(--soft);color:var(--accent)}.send:hover:not(:disabled){background:rgb(47 103 246 / .15)}.send:disabled{opacity:.5;cursor:default}button:active:not(:disabled){transform:translateY(1px)}::selection{background:var(--soft);color:var(--ink)}
@media(max-width:760px){main{max-width:426px;grid-template-columns:minmax(0,1fr);gap:48px}body{padding:36px 16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style></head><body><main><section aria-label="A · 辅助按钮保留外框"><h2>A · 辅助按钮保留外框</h2><div class="composer framed"><textarea aria-label="A · 辅助按钮保留外框：输入内容" placeholder="输入你的想法与目标" rows="2" spellcheck="false"></textarea><div class="toolbar"><div class="group"><button type="button" class="tool " aria-label="附件" title="附件" ><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paperclip" aria-hidden="true"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"></path></svg><span class="label">附件</span></button><button type="button" class="tool " aria-label="开发" title="开发" ><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hammer" aria-hidden="true"><path d="m15 12-9.373 9.373a1 1 0 0 1-3.001-3L12 9"></path><path d="m18 15 4-4"></path><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172v-.344a2 2 0 0 0-.586-1.414l-1.657-1.657A6 6 0 0 0 12.516 3H9l1.243 1.243A6 6 0 0 1 12 8.485V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"></path></svg><span class="label">开发</span></button><button type="button" class="tool skill" aria-label="技能" title="技能（点击预览选中态）" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-blocks" aria-hidden="true"><path d="M10 22V7a1 1 0 0 0-1-1H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5a1 1 0 0 0-1-1H2"></path><rect x="14" y="2" width="8" height="8" rx="1"></rect></svg><span class="label">技能</span></button></div><div class="group"><button type="button" class="tool wide" aria-label="当前页" title="当前页" ><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-crosshair" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="22" x2="18" y1="12" y2="12"></line><line x1="6" x2="2" y1="12" y2="12"></line><line x1="12" x2="12" y1="6" y2="2"></line><line x1="12" x2="12" y1="22" y2="18"></line></svg><span class="label">当前页</span></button><button type="button" class="tool wide" aria-label="模型" title="模型" ><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cpu" aria-hidden="true"><path d="M12 20v2"></path><path d="M12 2v2"></path><path d="M17 20v2"></path><path d="M17 2v2"></path><path d="M2 12h2"></path><path d="M2 17h2"></path><path d="M2 7h2"></path><path d="M20 12h2"></path><path d="M20 17h2"></path><path d="M20 7h2"></path><path d="M7 20v2"></path><path d="M7 2v2"></path><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="8" y="8" width="8" height="8" rx="1"></rect></svg><span class="label">模型</span></button><button type="button" class="send" aria-label="发送（仅样式展示）" title="发送（仅样式展示，不提交内容）" disabled><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path><path d="m21.854 2.147-10.94 10.939"></path></svg></button></div></div></div></section><section aria-label="B · 辅助按钮直接贴在背景上"><h2>B · 辅助按钮直接贴在背景上</h2><div class="composer flat"><textarea aria-label="B · 辅助按钮直接贴在背景上：输入内容" placeholder="输入你的想法与目标" rows="2" spellcheck="false"></textarea><div class="toolbar"><div class="group"><button type="button" class="tool " aria-label="附件" title="附件" ><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paperclip" aria-hidden="true"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"></path></svg><span class="label">附件</span></button><button type="button" class="tool " aria-label="开发" title="开发" ><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hammer" aria-hidden="true"><path d="m15 12-9.373 9.373a1 1 0 0 1-3.001-3L12 9"></path><path d="m18 15 4-4"></path><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172v-.344a2 2 0 0 0-.586-1.414l-1.657-1.657A6 6 0 0 0 12.516 3H9l1.243 1.243A6 6 0 0 1 12 8.485V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"></path></svg><span class="label">开发</span></button><button type="button" class="tool skill" aria-label="技能" title="技能（点击预览选中态）" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-blocks" aria-hidden="true"><path d="M10 22V7a1 1 0 0 0-1-1H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5a1 1 0 0 0-1-1H2"></path><rect x="14" y="2" width="8" height="8" rx="1"></rect></svg><span class="label">技能</span></button></div><div class="group"><button type="button" class="tool wide" aria-label="当前页" title="当前页" ><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-crosshair" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="22" x2="18" y1="12" y2="12"></line><line x1="6" x2="2" y1="12" y2="12"></line><line x1="12" x2="12" y1="6" y2="2"></line><line x1="12" x2="12" y1="22" y2="18"></line></svg><span class="label">当前页</span></button><button type="button" class="tool wide" aria-label="模型" title="模型" ><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cpu" aria-hidden="true"><path d="M12 20v2"></path><path d="M12 2v2"></path><path d="M17 20v2"></path><path d="M17 2v2"></path><path d="M2 12h2"></path><path d="M2 17h2"></path><path d="M2 7h2"></path><path d="M20 12h2"></path><path d="M20 17h2"></path><path d="M20 7h2"></path><path d="M7 20v2"></path><path d="M7 2v2"></path><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="8" y="8" width="8" height="8" rx="1"></rect></svg><span class="label">模型</span></button><button type="button" class="send" aria-label="发送（仅样式展示）" title="发送（仅样式展示，不提交内容）" disabled><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path><path d="m21.854 2.147-10.94 10.939"></path></svg></button></div></div></div></section></main><script>
const editors=[...document.querySelectorAll('textarea')];editors.forEach(editor=>editor.addEventListener('input',()=>{editors.forEach(other=>{if(other!==editor)other.value=editor.value});document.querySelectorAll('.send').forEach(button=>button.disabled=!editor.value.trim())}));document.querySelectorAll('.skill').forEach(button=>button.addEventListener('click',()=>{const selected=button.getAttribute('aria-pressed')!=='true';document.querySelectorAll('.skill').forEach(other=>{other.setAttribute('aria-pressed',String(selected));other.querySelector('.label').textContent=selected?'技能 1':'技能'})}));
</script></body></html>
