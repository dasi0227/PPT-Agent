<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模式切换 · 控件对比</title>
<style>
:root{color-scheme:light dark;--page:#f8fafc;--panel:#fff;--ink:#1c2737;--muted:#627085;--line:#e0e6ee;--track:#edf1f6;--blue:#315fe0;--soft:#e8efff;--hover:#dee8ff;--shadow:0 12px 36px #203b6420}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}main{max-width:880px;margin:auto;padding:56px 36px 40px}h1{font-size:26px;letter-spacing:-.6px;font-weight:620;margin:0 0 10px}header p{color:var(--muted);font-size:14px;margin:0;line-height:1.7}section{padding:34px 0 28px;border-bottom:1px solid var(--line)}h2{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;margin:0 0 9px}h2 small{font-size:11px;font-weight:500;color:var(--blue);background:var(--soft);padding:3px 7px;border-radius:5px}section p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}.stage{display:flex;align-items:center;justify-content:center;gap:10px;min-height:112px;padding:22px 0 8px}.caption{display:block;text-align:center;font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;white-space:nowrap}button:focus-visible{background:var(--hover)!important;box-shadow:inset 0 -3px 0 var(--blue)}button:active{transform:scale(.975)}svg{display:block;flex:none}button{transition:background .16s,transform .16s,box-shadow .16s}.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;background:var(--soft);color:var(--blue);border:0;border-radius:999px;padding:0 15px;font-size:14px;font-weight:550}.pill:hover{background:var(--hover)}.current{display:flex;align-items:center;gap:9px;min-width:76px}.swap{margin-left:5px;color:var(--muted)}.swap svg{width:15px;height:15px}.pill:hover .swap{color:var(--blue)}.compact .current{min-width:60px}.changed{animation:reveal .19s ease-out}@keyframes reveal{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.rocker{--pos:0;position:relative;height:44px;width:184px;background:var(--track);color:var(--muted);border:0;border-radius:999px;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:4px;font-size:13px;isolation:isolate}.rocker.short{width:154px}.rocker::before{content:"";position:absolute;z-index:-1;left:4px;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:999px;background:var(--panel);box-shadow:0 1px 4px #24354f13;transform:translateX(calc(var(--pos)*100%));transition:transform .22s cubic-bezier(.2,.7,.2,1)}.rocker span{display:flex;align-items:center;justify-content:center;gap:5px;transition:color .2s}.rocker span svg{width:16px;height:16px}.rocker span.active{color:var(--blue);font-weight:600}.rocker:hover{background:var(--line)}
.combined{gap:13px;min-width:202px;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 2px #203b6407}.combined .primary{display:flex;align-items:center;gap:8px}.combined .secondary{display:flex;align-items:center;gap:6px;color:var(--blue);border-left:1px solid var(--line);padding-left:13px;font-weight:500}.combined .secondary svg{height:16px;width:16px}.combined>.chevron svg{width:14px;height:14px;color:var(--muted)}.combined[aria-expanded=true]{background:var(--soft);border-color:transparent}.menu{position:fixed;width:244px;z-index:10;padding:7px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.menu[hidden]{display:none}.menu-label{padding:6px 9px 7px;font-size:11px;color:var(--muted)}.menu button{display:flex;align-items:center;width:100%;gap:9px;border:0;border-radius:8px;height:40px;padding:0 9px;text-align:left;background:transparent;color:var(--ink);font-size:13px}.menu button:hover,.menu button[aria-checked=true]{background:var(--soft);color:var(--blue)}.menu .item-mode{color:var(--muted);margin-left:auto;font-size:12px}.menu .check{width:16px;margin-left:4px}.menu .check svg{width:16px;height:16px}.menu button[aria-checked=false] .check{visibility:hidden}.divider{height:1px;background:var(--line);margin:5px 7px}footer{font-size:11px;color:var(--muted);margin-top:24px;line-height:1.9}a{color:var(--muted);text-underline-offset:3px}a:hover{color:var(--blue)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:540px){main{padding:30px 20px}h1{font-size:23px}section{padding-top:28px}.stage{gap:8px}.rocker{width:160px}.rocker.short{width:138px}.rocker span{gap:4px}.rocker span svg{width:14px;height:14px}.pill{padding:0 12px;gap:8px}.current{min-width:72px}.swap{margin-left:0}}
@media(max-width:350px){.stage{flex-wrap:wrap}.rocker{width:158px}.rocker.short{width:132px}}
@media(prefers-color-scheme:dark){:root{--page:#151a22;--panel:#232c3a;--ink:#e7ecf5;--muted:#abb8cc;--line:#39465a;--track:#252e3c;--blue:#a1bcff;--soft:#293b61;--hover:#334b79;--shadow:0 12px 36px #0006}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body><main>
<header><h1>把切换收进一个按钮</h1><p>只比较模式控件。以下三组均可直接点击体验。</p></header>
<section aria-labelledby="heading-a"><h2 id="heading-a">A · 当前状态胶囊 <small>推荐</small></h2><p>常驻当前图标与名称，点击切到另一态。保留两个独立维度，操作最直接。</p><div class="stage" id="direct"></div><span class="caption">两个按钮 · 点击即切换</span></section>
<section aria-labelledby="heading-b"><h2 id="heading-b">B · 双态拨片</h2><p>两个选项始终可见，白色滑块标明当前值。每个拨片是一个完整按钮。</p><div class="stage" id="rockers"></div><span class="caption">点击整枚拨片切换 · 辨识更直观，占宽略多</span></section>
<section aria-labelledby="heading-c"><h2 id="heading-c">C · 合并状态按钮 <small>最省空间</small></h2><p>将两个维度压成一个入口，点击后选择目标组合。</p><div class="stage"><button type="button" id="combined" class="pill combined" aria-haspopup="menu" aria-expanded="false" aria-controls="mode-menu"></button></div><span class="caption">一个按钮 · 两步切换到任意组合</span></section>
<footer>交互参考：<a href="https://fluent2.microsoft.design/components/web/react/core/button/usage" target="_blank" rel="noreferrer">Fluent 2 状态与操作表达</a>、<a href="https://www.radix-ui.com/primitives/docs/components/toggle" target="_blank" rel="noreferrer">Radix Toggle</a>。视觉沿用项目的 soft blue 与 Lucide。</footer>
</main>
<div id="mode-menu" class="menu" role="menu" aria-label="模式选择" hidden><div class="menu-label" role="presentation">模式选择</div><div id="menu-options" role="presentation"></div></div>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
<script>
const icons={"FileText":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-file-text\" aria-hidden=\"true\"><path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\"></path><path d=\"M14 2v5a1 1 0 0 0 1 1h5\"></path><path d=\"M10 9H8\"></path><path d=\"M16 13H8\"></path><path d=\"M16 17H8\"></path></svg>","Presentation":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-presentation\" aria-hidden=\"true\"><path d=\"M2 3h20\"></path><path d=\"M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3\"></path><path d=\"m7 21 5-5 5 5\"></path></svg>","AppWindow":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-app-window\" aria-hidden=\"true\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"></rect><path d=\"M10 4v4\"></path><path d=\"M2 8h20\"></path><path d=\"M6 4v4\"></path></svg>","FilePen":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-file-pen\" aria-hidden=\"true\"><path d=\"M12.659 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v9.34\"></path><path d=\"M14 2v5a1 1 0 0 0 1 1h5\"></path><path d=\"M10.378 12.622a1 1 0 0 1 3 3.003L8.36 20.637a2 2 0 0 1-.854.506l-2.867.837a.5.5 0 0 1-.62-.62l.836-2.869a2 2 0 0 1 .506-.853z\"></path></svg>","ArrowLeftRight":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-left-right\" aria-hidden=\"true\"><path d=\"M8 3 4 7l4 4\"></path><path d=\"M4 7h16\"></path><path d=\"m16 21 4-4-4-4\"></path><path d=\"M20 17H4\"></path></svg>","ChevronDown":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-down\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"></path></svg>","Check":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-check\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"></path></svg>"};
const dimensions=[{label:'内容模式',names:['设计稿','幻灯片'],icons:['FileText','Presentation']},{label:'显示方式',names:['预览','源码'],icons:['AppWindow','FilePen']}];
const state={direct:[1,0],rockers:[1,0],combined:[1,0]};
const icon=name=>icons[name];
const announce=values=>document.getElementById('announcement').textContent=dimensions.map((d,i)=>d.names[values[i]]).join('，');
function updateButton(button,kind,index,animate=false){const d=dimensions[index],value=state[kind][index];button.setAttribute('aria-label',d.label+'：当前'+d.names[value]+'，点击切换为'+d.names[1-value]);button.title='切换为'+d.names[1-value];if(kind==='direct'){button.innerHTML='<span class="current'+(animate?' changed':'')+'">'+icon(d.icons[value])+'<span>'+d.names[value]+'</span></span><span class="swap">'+icon('ArrowLeftRight')+'</span>';}else{button.style.setProperty('--pos',value);button.innerHTML=d.names.map((name,i)=>'<span class="'+(i===value?'active':'')+'">'+icon(d.icons[i])+name+'</span>').join('');}}
for(const kind of ['direct','rockers'])dimensions.forEach((d,index)=>{const button=document.createElement('button');button.type='button';button.className=kind==='direct'?'pill'+(index?' compact':''):'rocker'+(index?' short':'');button.addEventListener('click',()=>{state[kind][index]=1-state[kind][index];updateButton(button,kind,index,true);announce(state[kind]);});updateButton(button,kind,index);document.getElementById(kind).append(button);});
const trigger=document.getElementById('combined'),menu=document.getElementById('mode-menu'),options=document.getElementById('menu-options');
function renderCombined(){const [content,view]=state.combined;trigger.innerHTML='<span class="primary">'+icon(dimensions[0].icons[content])+dimensions[0].names[content]+'</span><span class="secondary">'+icon(dimensions[1].icons[view])+dimensions[1].names[view]+'</span><span class="chevron">'+icon('ChevronDown')+'</span>';trigger.setAttribute('aria-label','当前'+dimensions[0].names[content]+'，'+dimensions[1].names[view]+'，选择模式');options.innerHTML='';for(let c=0;c<2;c++){if(c)options.insertAdjacentHTML('beforeend','<div class="divider" role="separator"></div>');for(let v=0;v<2;v++){const item=document.createElement('button');item.type='button';item.setAttribute('role','menuitemradio');item.setAttribute('aria-checked',String(c===content&&v===view));item.tabIndex=-1;item.innerHTML=icon(dimensions[0].icons[c])+dimensions[0].names[c]+'<span class="item-mode">'+dimensions[1].names[v]+'</span><span class="check">'+icon('Check')+'</span>';item.addEventListener('click',()=>{state.combined=[c,v];renderCombined();closeMenu();announce(state.combined);});options.append(item);}}}
function positionMenu(){const r=trigger.getBoundingClientRect(),gap=6;const availableBelow=innerHeight-r.bottom-gap-12,availableAbove=r.top-gap-12;const above=availableBelow<menu.scrollHeight&&availableAbove>availableBelow;menu.style.maxHeight=Math.max(60,above?availableAbove:availableBelow)+'px';menu.style.overflowY='auto';const height=menu.getBoundingClientRect().height;menu.style.left=Math.max(12,Math.min(r.left,innerWidth-menu.offsetWidth-12))+'px';menu.style.top=Math.max(12,above?r.top-height-gap:r.bottom+gap)+'px';}
function openMenu(){menu.hidden=false;trigger.setAttribute('aria-expanded','true');positionMenu();options.querySelector('[aria-checked=true]').focus();}
function closeMenu(restoreFocus=true){menu.hidden=true;trigger.setAttribute('aria-expanded','false');if(restoreFocus)trigger.focus();}
trigger.addEventListener('click',()=>menu.hidden?openMenu():closeMenu());trigger.addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();openMenu();}});
menu.addEventListener('keydown',event=>{const items=[...options.querySelectorAll('button')],i=items.indexOf(document.activeElement);let next;if(event.key==='ArrowDown')next=(i+1)%items.length;if(event.key==='ArrowUp')next=(i+items.length-1)%items.length;if(event.key==='Home')next=0;if(event.key==='End')next=items.length-1;if(next!==undefined){event.preventDefault();items[next].focus();}if(event.key==='Escape'){event.preventDefault();closeMenu();}if(event.key==='Tab'){event.preventDefault();closeMenu();}});
document.addEventListener('pointerdown',event=>{if(!menu.hidden&&!menu.contains(event.target)&&!trigger.contains(event.target))closeMenu(false);});window.addEventListener('resize',()=>{if(!menu.hidden)positionMenu();});window.addEventListener('scroll',()=>{if(!menu.hidden)positionMenu();},{passive:true});renderCombined();
</script></body></html>
