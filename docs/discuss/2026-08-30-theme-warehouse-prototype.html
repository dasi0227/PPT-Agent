<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme 仓库原型</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --workspace: #e9edf2;
      --panel: #f8f9fb;
      --panel-muted: #f0f3f7;
      --canvas: #dfe5ec;
      --surface: #ffffff;
      --ink: #17202b;
      --muted: #5f6b7a;
      --subtle: #95a0ae;
      --border: #d5dbe3;
      --border-strong: #bcc5d0;
      --accent: #2f67f6;
      --accent-soft: #e8efff;
      --success: #2f7d65;
      --shadow: 0 12px 32px rgba(51, 65, 85, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 1080px;
      min-height: 100vh;
      overflow: hidden;
      background: var(--workspace);
      color: var(--ink);
      font: 14px/1.45 Aptos, Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .app { display: grid; grid-template-rows: 48px minmax(0, 1fr); height: 100vh; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-strong); background: var(--panel); padding: 0 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .brand-mark {
      display: grid; width: 28px; height: 28px; place-items: center;
      border-radius: 6px; background: var(--ink); color: white;
    }
    .top-actions, .inline { display: flex; align-items: center; gap: 6px; }
    .icon-button {
      display: inline-grid; width: 32px; height: 32px; place-items: center;
      border: 0; border-radius: 6px; background: transparent; color: var(--muted); text-decoration: none; cursor: pointer;
    }
    .icon-button:hover { background: var(--panel-muted); color: var(--ink); }
    [data-lucide] { width: 16px; height: 16px; stroke-width: 1.75; }
    .shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 0; }
    .nav {
      border-right: 1px solid var(--border); background: var(--panel);
      padding: 14px 10px; display: flex; flex-direction: column; min-height: 0;
    }
    .nav-title { padding: 4px 10px 13px; font-size: 18px; font-weight: 700; }
    .nav-item {
      display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center;
      min-height: 36px; gap: 8px; padding: 0 10px; border: 0; border-radius: 6px;
      background: transparent; color: var(--muted); text-align: left; cursor: pointer;
    }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .nav-item:hover:not(.active) { background: var(--panel-muted); color: var(--ink); }
    .count { color: var(--subtle); font-size: 12px; font-variant-numeric: tabular-nums; }
    .content { display: grid; grid-template-rows: 64px minmax(0, 1fr); min-width: 0; min-height: 0; }
    .page-head {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 20px;
    }
    .page-title { font-size: 18px; font-weight: 700; }
    .search {
      display: grid; grid-template-columns: 18px 210px; align-items: center; gap: 6px;
      height: 32px; padding: 0 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
      color: var(--subtle);
    }
    .search input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 13px; }
    .body { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
    .theme-list {
      overflow: auto; border-right: 1px solid var(--border); background: var(--panel);
      padding: 10px;
    }
    .theme-row {
      width: 100%; display: grid; grid-template-columns: 94px minmax(0, 1fr); gap: 10px;
      margin: 0 0 6px; padding: 8px; border: 1px solid transparent; border-radius: 7px;
      background: transparent; text-align: left; cursor: pointer;
    }
    .theme-row:hover { background: var(--panel-muted); }
    .theme-row.active { border-color: rgba(47,103,246,.42); background: var(--accent-soft); }
    .mini {
      position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px;
      background: var(--t-bg); color: var(--t-fg); box-shadow: inset 0 0 0 1px rgba(120,130,145,.22);
    }
    .mini::before { content: ""; position: absolute; left: 8px; top: 8px; width: 34px; height: 4px; border-radius: 2px; background: var(--t-primary); }
    .mini::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 8px; height: 16px; border-radius: var(--t-radius); background: var(--t-surface); box-shadow: var(--t-shadow); }
    .mini-bars { position: absolute; inset: 20px 8px 28px; display: flex; align-items: end; gap: 3px; }
    .mini-bars i { display: block; flex: 1; border-radius: 2px 2px 0 0; background: var(--t-accent); opacity: .86; }
    .mini-bars i:nth-child(1) { height: 42%; } .mini-bars i:nth-child(2) { height: 76%; } .mini-bars i:nth-child(3) { height: 56%; } .mini-bars i:nth-child(4) { height: 88%; }
    .theme-name { display:block; margin: 1px 0 3px; font-size: 13px; font-weight: 650; }
    .theme-desc { display:block; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .swatches { display: flex; gap: 4px; margin-top: 8px; }
    .swatches i { width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(23,32,43,.12); }
    .preview-pane { display: grid; grid-template-rows: 72px minmax(0, 1fr); min-width: 0; min-height: 0; background: var(--canvas); }
    .preview-toolbar {
      position: relative; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 14px 0 16px;
      border-bottom: 1px solid var(--border); background: var(--panel);
    }
    .theme-summary { min-width: 0; }
    .theme-title-line { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .selected-title { font-weight: 650; }
    .source-link { width: 24px; height: 24px; color: var(--muted); text-decoration: none; }
    .theme-metadata { display: flex; align-items: center; gap: 14px; margin-top: 6px; color: var(--muted); font-size: 11px; }
    .meta-item { display: inline-flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
    .meta-label { color: var(--subtle); }
    .palette { display: flex; gap: 4px; }
    .palette i { width: 13px; height: 13px; border-radius: 3px; border: 1px solid rgba(23,32,43,.12); }
    .font-value { color: var(--ink); font-weight: 550; }
    .segmented { display: flex; align-items: center; padding: 2px; border-radius: 999px; background: var(--panel-muted); }
    .segment {
      height: 26px; padding: 0 11px; border: 0; border-radius: 999px; background: transparent;
      color: var(--subtle); font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .segment.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(51,65,85,.13); }
    .stage-wrap { display: flex; align-items: center; justify-content: center; min-height: 0; padding: 24px; overflow: auto; }
    .stage {
      position: relative; width: min(960px, 100%); aspect-ratio: 16 / 9; overflow: hidden;
      border-radius: 6px; background: var(--t-bg); color: var(--t-fg); box-shadow: var(--shadow);
      font-family: var(--t-font); transition: background-color .22s ease, color .22s ease;
    }
    .stage-inner { position: absolute; inset: 0; display: grid; grid-template-columns: 1.14fr .86fr; gap: 5%; padding: 7% 7.5% 6.5%; }
    .stage[data-view="cover"] .stage-inner { grid-template-columns: 1fr; align-items: center; padding-right: 20%; }
    .stage[data-view="cover"] .showcase-card,
    .stage[data-view="cover"] .metric-line { display: none; }
    .stage[data-view="cover"] h1 { max-width: 13ch; font-size: clamp(34px, 5vw, 70px); }
    .stage[data-view="data"] .stage-inner { grid-template-columns: .72fr 1.28fr; gap: 4%; }
    .stage[data-view="data"] h1 { font-size: clamp(24px, 3vw, 44px); }
    .stage[data-view="data"] .metric-line { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12%; }
    .stage-kicker { color: var(--t-primary); font-size: clamp(10px, 1.1vw, 15px); font-weight: 750; }
    .stage h1 { max-width: 12ch; margin: 4% 0 3%; font-size: clamp(26px, 4vw, 58px); line-height: 1.02; letter-spacing: 0; }
    .stage-copy { max-width: 38ch; margin: 0; color: var(--t-muted); font-size: clamp(10px, 1.35vw, 18px); }
    .metric-line { display: flex; gap: 7%; margin-top: 10%; }
    .metric strong { display: block; color: var(--t-primary); font-size: clamp(20px, 3vw, 42px); line-height: 1; }
    .metric span { display: block; margin-top: 6px; color: var(--t-muted); font-size: clamp(8px, 1vw, 13px); }
    .showcase-card {
      align-self: center; padding: 8%; border: 1px solid var(--t-border); border-radius: var(--t-radius);
      background: var(--t-surface); box-shadow: var(--t-shadow);
    }
    .card-title { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: clamp(11px, 1.2vw, 16px); }
    .card-title i { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--t-accent); }
    .chart { display: flex; align-items: end; gap: 7%; height: 170px; margin: 8% 0; border-bottom: 1px solid var(--t-border); }
    .chart i { flex: 1; border-radius: 4px 4px 0 0; background: var(--t-primary); }
    .chart i:nth-child(1) { height: 34%; opacity: .38; } .chart i:nth-child(2) { height: 58%; opacity: .55; }
    .chart i:nth-child(3) { height: 46%; opacity: .7; } .chart i:nth-child(4) { height: 82%; }
    .quote { border-left: 3px solid var(--t-accent); padding-left: 10px; color: var(--t-muted); font-size: clamp(9px, 1vw, 13px); }
    [data-theme="swiss"] { --t-bg:#f5f6f8; --t-surface:#fff; --t-fg:#101820; --t-muted:#59636f; --t-primary:#1769e0; --t-accent:#ea4e3d; --t-border:#d8dee6; --t-radius:4px; --t-shadow:0 12px 28px rgba(32,48,64,.11); --t-font:Aptos,Arial,sans-serif; }
    [data-theme="tokyo"] { --t-bg:#171a2b; --t-surface:#22263c; --t-fg:#d9e0ff; --t-muted:#8993bd; --t-primary:#7aa2f7; --t-accent:#bb9af7; --t-border:#343b5c; --t-radius:8px; --t-shadow:0 15px 36px rgba(0,0,0,.35); --t-font:Aptos,Arial,sans-serif; }
    [data-theme="signal"] { --t-bg:#fff8e8; --t-surface:#fffdf7; --t-fg:#171717; --t-muted:#625e55; --t-primary:#ed3b2f; --t-accent:#1264e8; --t-border:#1c1c1c; --t-radius:2px; --t-shadow:6px 6px 0 #171717; --t-font:Aptos,Arial,sans-serif; }
    [data-theme="editorial"] { --t-bg:#edf0f4; --t-surface:#f9fafb; --t-fg:#19212a; --t-muted:#687380; --t-primary:#203e66; --t-accent:#bd3d51; --t-border:#bbc4ce; --t-radius:1px; --t-shadow:0 12px 30px rgba(48,60,76,.12); --t-font:Georgia,\"Times New Roman\",serif; }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
  </style>
</head>

    const themes = [

      { id:'editorial', name:'Editorial Slate', desc:'冷灰纸张与编辑式排版节奏', colors:['#edf0f4','#19212a','#203e66','#bd3d51'], font:'Georgia / Serif', source:'../../backend/seed/assets/themes/editorial-serif/tokens.css' }
    ];
    const list = document.getElementById('themeList');
    const stage = document.getElementById('stage');
    let query = '';
    function renderList(selected) {
      const visible = themes.filter(t => `${t.name}${t.desc}`.toLowerCase().includes(query.toLowerCase()));
      list.innerHTML = visible.map(t => `<button class="theme-row ${t.id===selected?'active':''}" data-id="${t.id}">
        <span class="mini" data-theme="${t.id}"><span class="mini-bars"><i></i><i></i><i></i><i></i></span></span>
        <span><span class="theme-name">${t.name}</span><span class="theme-desc">${t.desc}</span>
        <span class="swatches">${t.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span></span>
      </button>`).join('') || '<div style="padding:24px 12px;color:var(--muted);font-size:12px;text-align:center">没有匹配的主题</div>';
      list.querySelectorAll('.theme-row').forEach(btn => btn.addEventListener('click', () => selectTheme(btn.dataset.id)));
    }
    function selectTheme(id) {
const theme = themes.find(t => t.id === id);
      stage.dataset.theme = id;
      document.getElementById('selectedName').textContent = theme.name;
      document.getElementById('fontValue').textContent = theme.font;
      document.getElementById('sourceLink').href = theme.source;
      document.getElementById('palette').innerHTML = theme.colors.map(c=>`<i style="background:${c}" title="${c}"></i>`).join('');
      renderList(id);
    }
    document.getElementById('search').addEventListener('input', event => { query = event.target.value; renderList(stage.dataset.theme); });
    document.querySelectorAll('.segment').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('.segment').forEach(item => item.classList.remove('active'));
      button.classList.add('active');
      stage.dataset.view = button.dataset.view;
    }));
    selectTheme('swiss');
    lucide.createIcons();
  </script>


</body></html>
