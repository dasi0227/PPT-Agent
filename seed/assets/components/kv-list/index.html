<!--
---
name: "键值列表"
description: "清晰呈现多组名称、数值与状态信息"
---
-->
<style>
.kv-list {
  width: min(100%, 760px);
  margin: 0;
  border-top: 2px solid var(--color-fg);
}
.kv-list__row {
  display: grid;
  grid-template-columns: minmax(88px, .72fr) minmax(110px, 1fr) auto;
  align-items: baseline;
  gap: var(--space-4);
  padding: var(--space-4) 0;
  border-bottom: 1px solid var(--color-border, color-mix(in srgb, var(--color-fg) 15%, transparent));
}
.kv-list__key,
.kv-list__val,
.kv-list__note {
  margin: 0;
}
.kv-list__key {
  color: color-mix(in srgb, var(--color-fg) 58%, transparent);
  font-family: var(--font-mono, monospace);
  font-size: var(--text-caption);
  letter-spacing: .05em;
}
.kv-list__val {
  color: var(--color-fg);
  font-size: var(--text-body);
  font-weight: 750;
}
.kv-list__note {
  color: var(--color-primary);
  font-size: var(--text-caption);
  font-weight: 700;
  text-align: right;
}
</style>
<dl class="kv-list">
  <div class="kv-list__row"><dt class="kv-list__key">项目阶段</dt><dd class="kv-list__val">视觉定稿</dd><dd class="kv-list__note">进行中</dd></div>
  <div class="kv-list__row"><dt class="kv-list__key">页面数量</dt><dd class="kv-list__val">18 页</dd><dd class="kv-list__note">已确认</dd></div>
  <div class="kv-list__row"><dt class="kv-list__key">交付时间</dt><dd class="kv-list__val">周五 18:00</dd><dd class="kv-list__note">按计划</dd></div>
</dl>
