<!--
---
name: "关键指标"
description: "突出单个核心数字、变化幅度与目标进度"
---
-->
<style>
.stat-badge {
  display: grid;
  width: min(100%, 430px);
  gap: var(--space-4);
  padding: var(--space-6);
  border: 1px solid var(--color-border, color-mix(in srgb, var(--color-fg) 14%, transparent));
  border-radius: var(--radius-lg);
  background: var(--color-surface, var(--color-bg));
  box-shadow: var(--shadow-card);
}
.stat-badge__header,
.stat-badge__footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
}
.stat-badge__label {
  color: color-mix(in srgb, var(--color-fg) 62%, transparent);
  font-size: var(--text-caption);
  font-weight: 700;
}
.stat-badge__delta {
  padding: calc(var(--space-2) * .55) var(--space-2);
  border-radius: 999px;
  background: color-mix(in srgb, var(--color-primary) 12%, transparent);
  color: var(--color-primary);
  font-family: var(--font-mono, monospace);
  font-size: var(--text-caption);
  font-weight: 800;
}
.stat-badge__value {
  color: var(--color-fg);
  font-size: calc(var(--text-h1) * 1.55);
  font-weight: 800;
  letter-spacing: -.055em;
  line-height: .9;
}
.stat-badge__track {
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--color-muted);
}
.stat-badge__track::after {
  content: "";
  display: block;
  width: 84%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
}
.stat-badge__footer {
  color: color-mix(in srgb, var(--color-fg) 56%, transparent);
  font-size: var(--text-caption);
}
.stat-badge__footer strong {
  color: var(--color-fg);
}
</style>
<article class="stat-badge">
  <header class="stat-badge__header"><span class="stat-badge__label">页面交付率</span><span class="stat-badge__delta">+8.4%</span></header>
  <strong class="stat-badge__value">84%</strong>
  <div class="stat-badge__track" aria-hidden="true"></div>
  <footer class="stat-badge__footer"><span>本月已交付 <strong>42 页</strong></span><span>目标 50 页</span></footer>
</article>
