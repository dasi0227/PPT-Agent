app:
    port: 8787

llm:
    - name: DeepSeek Flash
      protocol: anthropic
      base_url: https://api.deepseek.com/anthropic/v1
      model: deepseek-flash
      key: sk-your-deepseek-key
    - name: MiMo Flash
      protocol: anthropic
      base_url: https://api.xiaomimimo.com/anthropic/v1
      model: mimo-v2.6-flash
      key: sk-your-mimo-key
    - name: GLM Flash
      protocol: anthropic
      base_url: https://open.bigmodel.cn/api/anthropic/v1
      model: glm-5.3-flash
      key: sk-your-glm-key
    - name: Kimi K3
      protocol: anthropic
      base_url: https://api.moonshot.cn/anthropic/v1
      model: kimi-k3
      key: sk-your-kimi-key
    - name: GPT 5.6
      protocol: responses
      base_url: https://api.openai.com/v1
      model: gpt-5.6
      key: sk-your-openai-key
main-road:
    default: Kimi K3
    fallback: null
side-road:
    default: DeepSeek Flash
    fallback: null
    rename: null
    compact: null
    commit: null
    polish: null
    handoff: null
    suggest: null

agent:
    auto_rename_enabled: true
    auto_suggest_enabled: true
    show_tool_failures: false
    require_resource_approval: true
    require_high_risk_approval: true

# Command sandbox policy. Changes take effect after restarting the backend.
sandbox:
    read_roots: []
    network:
        allowed_domains: []
    execution:
        timeout_seconds: 120
        max_output_bytes: 8388608

# One provider for input classification, tool selection, rename decisions and page assessment.
# Generation models remain independent. Omit unused providers; no automatic fallback.
# User instructions fail closed when the decision block is absent.
