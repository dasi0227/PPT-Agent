llm:
    - name: DeepSeek Flash
      provider: deepseek
      protocol: anthropic
      base_url: https://api.deepseek.com/anthropic/v1
      model: deepseek-flash
      key: sk-your-deepseek-key
    - name: Kimi K3
      provider: kimi
      protocol: anthropic
      base_url: https://api.moonshot.cn/anthropic/v1
      model: kimi-k3
      key: sk-your-kimi-key
    - name: GPT 5.6
      provider: openai
      protocol: responses
      base_url: https://api.openai.com/v1
      model: gpt-5.6
      key: sk-your-openai-key
