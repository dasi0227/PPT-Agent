<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title><style>
{{styles}}
html,body{margin:0;overflow:hidden;background:#111}
#canvas{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:white;transform-origin:center}
#slide{width:100%;height:100%;border:0}nav{position:fixed;right:12px;bottom:8px}
</style></head><body><main id="canvas"><iframe id="slide" sandbox="allow-scripts"></iframe></main>
<nav><button id="prev" aria-label="上一页">‹</button><button id="next" aria-label="下一页">›</button></nav>
<script type="application/json" id="presentation">{{presentation}}</script>
<script>{{decorations}}</script>
<script>
(() => {
  const { frame, pages } = JSON.parse(document.getElementById('presentation').textContent);
  const canvas = document.getElementById('canvas');
  const slide = document.getElementById('slide');
  const previous = document.getElementById('prev');
  const next = document.getElementById('next');
  let current = 0;
  function show(index) {
    current = Math.max(0, Math.min(pages.length - 1, index));
    const page = pages[current];
    slide.srcdoc = page.html;
    window.PPTDecorations.render(canvas, {
      ...frame, ordinal: current + 1, chapter: page.chapter === null ? null : { title: page.chapter },
    });
    previous.disabled = current === 0;
    next.disabled = current === pages.length - 1;
  }
  function resize() {
    const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
    canvas.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
  }
  previous.onclick = () => show(current - 1);
  next.onclick = () => show(current + 1);
  window.addEventListener('keydown', event => {
    if (['ArrowRight', 'PageDown', ' '].includes(event.key)) show(current + 1);
    else if (['ArrowLeft', 'PageUp'].includes(event.key)) show(current - 1);
    else if (event.key === 'Home') show(0);
    else if (event.key === 'End') show(pages.length - 1);
    else return;
    event.preventDefault();
  });
  window.addEventListener('resize', resize);
  resize();
  show(0);
})();
</script></body></html>
