<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../common/tokens.css">
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slide-scaler">
    <section class="slide-stage layout-kpi-grid" data-preview>
      <div class="slide-content">
        <h1 class="slide-title">关键指标</h1>
        <div class="kpi-grid" data-animate="stagger-list">
          <div class="kpi-cell"><span class="kpi-value">99.9%</span><span class="kpi-label">可用性</span></div>
          <div class="kpi-cell"><span class="kpi-value">120ms</span><span class="kpi-label">延迟</span></div>
          <div class="kpi-cell"><span class="kpi-value">3x</span><span class="kpi-label">吞吐</span></div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
