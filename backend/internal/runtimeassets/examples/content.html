<header class="content-head"><p class="kicker">01 / 内容与表达</p><h1 class="slide-title">把布局自由交给创作者，<br>把视觉一致性交给主题</h1></header>
<div class="content-columns"><div class="argument"><h2 class="section-title">从信息关系开始组织页面</h2><p class="slide-body">标题建立观点，正文解释原因，数据提供证据。页面可使用分栏、流程、对比与自由组合，不需要把所有信息塞进卡片。</p><blockquote class="quote">“统一的是视觉语言，<br>自由的是内容结构。”</blockquote><p class="caption">引用示例 · 主题切换不改变内容与阅读顺序</p></div>
<div class="evidence"><div class="metrics"><div class="card card-accent metric"><span class="metric-value">3</span><span class="metric-label">鲜明主题</span></div><div class="card card-outline metric"><span class="metric-value">100%</span><span class="metric-label">相同页面结构</span></div></div><div class="card card-soft"><h2 class="section-title">局部增强，仍然融入整体</h2><p class="slide-body">布局类只描述位置与间距；特殊强调引用语义变量。切换主题后，文字、容器与图形自动保持一致。</p></div></div></div>
</section></main></body></html>
